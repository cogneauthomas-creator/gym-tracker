<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Tracker</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F7; --card:#FFFFFF; --card2:#EEF1F5; --line:#E4E7EC;
  --txt:#0B0F14; --mut:#6B7280; --acc:#3B82F6; --acc-d:#2563EB;
  --lime:#16A34A; --org:#F59E0B; --red:#EF4444; --blue:#0EA5E9;
  --accbg:#E7F0FE; --okbg:#E7F6EC; --redbg:#FDECEC; --orgbg:#FEF3E2;
  --fig:#CDD3DC; --figon:#3B82F6; --navbg:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --glow:none;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0F14; --card:#1A1F26; --card2:#111827; --line:#262D37;
    --txt:#FFFFFF; --mut:#A0A6B3; --acc:#3B82F6; --acc-d:#2563EB;
    --lime:#22C55E; --org:#F59E0B; --red:#EF4444; --blue:#38BDF8;
    --accbg:#14243F; --okbg:#0F2A1B; --redbg:#2D1517; --orgbg:#2C2213;
    --fig:#3A424E; --figon:#60A5FA; --navbg:rgba(11,15,20,.88);
    --shadow:none; --glow:0 0 24px rgba(59,130,246,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;color:var(--txt);background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px;font-size:16px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.mut{color:var(--mut)} .small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{font-size:17px;font-weight:600;margin:22px 2px 10px}
.page-title{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 16px}
.page-title h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0}
.page-title .ic-btn{color:var(--txt)}
/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:600;font-size:17px;text-align:center}
.btn.main{background:var(--acc);color:#fff;box-shadow:var(--glow)}
.btn.main:active{background:var(--acc-d)}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{height:46px;font-size:15px;border-radius:14px}
.btn svg.i{width:20px;height:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:99px;background:var(--card2);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
/* accueil */
.wk-top{display:flex;justify-content:space-between;align-items:flex-start}
.wk-lbl{font-size:16px;color:var(--mut);font-weight:500}
.wk-big{font-size:32px;font-weight:700;letter-spacing:-.6px;margin-top:6px}
.wk-big .of{color:var(--mut)}
.circles{display:flex;gap:14px;margin-top:14px}
.circ{width:34px;height:34px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.circ.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--glow)}
.circ svg.i{width:18px;height:18px;stroke-width:3}
.streak-row{display:flex;align-items:center;gap:10px;margin-top:16px;padding:14px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px}
.streak-row .grow{flex:1}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;padding:0 16px;border-radius:99px;background:var(--card);color:var(--txt);font-weight:600;font-size:15px;white-space:nowrap;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.tab.on{background:var(--acc);color:#fff;box-shadow:var(--glow)}
.tab .nx{width:6px;height:6px;border-radius:9px;background:currentColor;opacity:.9}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan-title{font-size:30px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.more{width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.plan-sub{font-size:15px;color:var(--mut);margin-top:4px}
.teaser{font-size:14px;font-weight:600;color:var(--lime);margin-top:8px}
.body-fig{display:flex;gap:2px;flex:none;filter:drop-shadow(0 0 10px rgba(59,130,246,.18))}
.exlist{margin:6px 0 14px}
.exrow{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.exrow:first-child{border-top:0}
.exrow .grow{flex:1;min-width:0}
.exrow .chev{color:var(--mut)}
.tile{width:52px;height:52px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.tile.sm{width:44px;height:44px;border-radius:12px}
.exname{font-weight:600;font-size:17px;line-height:1.25}
.exsub{font-size:14px;color:var(--mut);margin-top:2px}
.tg-mini{font-size:14px;font-weight:500;margin-top:4px;color:var(--mut)}
.pls{display:flex;gap:8px;margin-top:8px}
.pls span{background:var(--card2);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.duo .card{margin:0;padding:14px}
.mini-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:8px}
.mini-v{font-size:20px;font-weight:700}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left;gap:10px}
.list-item:first-of-type{border-top:0}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--orgbg);color:var(--org);white-space:nowrap}
.badge.lime{background:var(--okbg);color:var(--lime)}
.badge.red{background:var(--redbg);color:var(--red)}
.alert{background:var(--orgbg)}
.h{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:8px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav-in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.nav button svg.i{width:26px;height:26px;stroke-width:1.8}
.nav button.on{color:var(--acc)}
/* séance */
.wk-head{position:sticky;top:0;z-index:5;background:var(--bg);margin:calc(-12px - env(safe-area-inset-top)) -16px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
.wk-nav{display:grid;grid-template-columns:44px 1fr auto;align-items:center}
.wk-nav .ttl{text-align:center;font-weight:600;font-size:18px}
.btn-end{background:var(--red);color:#fff;font-weight:600;font-size:15px;padding:8px 14px;border-radius:12px}
.wk-clock{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.wk-clock .t{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.wk-clock .s{font-size:17px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.exhead{display:flex;align-items:center;gap:12px}
.exhead .grow{flex:1;min-width:0}
.editbtn{width:36px;height:36px;border-radius:10px;color:var(--txt);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;height:40px;border-radius:99px;font-weight:600;font-size:14px;background:var(--card2);color:var(--txt)}
.seg button.on{background:var(--acc);color:#fff}
.ex-note{font-size:13px;color:var(--org);margin-top:10px}
.last{font-size:15px;margin-top:12px}
.target{margin-top:12px;padding:13px 14px;border-radius:14px;font-size:16px;font-weight:600;background:var(--accbg);color:var(--txt);border:1px solid rgba(59,130,246,.25)}
.target.load{background:var(--orgbg);border-color:rgba(245,158,11,.3)}
.target.first,.target.routine{background:var(--card2);border-color:var(--line)}
.target.hold{background:var(--redbg);border-color:rgba(239,68,68,.3)}
.sets{margin-top:12px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center;padding:6px 0;transition:opacity .2s}
.set .idx{font-weight:600;font-size:15px;text-align:center;color:var(--txt)}
.stp{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;height:44px;overflow:hidden}
.stp button{width:30px;height:100%;font-size:20px;color:var(--mut);flex:none}
.stp input{border:0;background:none;text-align:center;padding:0;font-weight:600;font-size:17px;min-width:0;width:100%;border-radius:0;font-variant-numeric:tabular-nums}
.chk{width:36px;height:36px;border-radius:99px;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;justify-self:center}
.chk svg.i{width:18px;height:18px;stroke-width:3}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--glow)}
.set.done .stp{border-color:rgba(59,130,246,.35)}
.set.hit .idx{color:var(--lime)}
.setlinks{display:flex;justify-content:space-between;margin-top:6px}
.addset{font-size:15px;font-weight:500;padding:8px 0;display:flex;align-items:center;gap:6px;color:var(--txt)}
.addset.rm{color:var(--red)}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.feel button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:var(--card2);font-size:12px;font-weight:600;border:1.5px solid transparent}
.feel button svg{width:26px;height:26px}
.feel .easy{color:var(--lime)} .feel .ok{color:var(--acc)} .feel .hard{color:var(--org)} .feel .pain{color:var(--red)}
.feel button.on{border-color:currentColor;background:var(--card)}
.ssdiv{display:flex;align-items:center;gap:10px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px;margin:-4px 4px 12px}
.ssdiv:before,.ssdiv:after{content:"";flex:1;height:1px;background:var(--line)}
.card.ss-top{margin-bottom:8px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;width:calc(100% - 32px);max-width:528px;background:var(--card);border-radius:18px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:1px solid var(--line)}
.timer .lbl{font-size:20px;font-weight:600}
.timer .t{font-size:20px;font-weight:600;flex:1;font-variant-numeric:tabular-nums}
.timer .p30{background:var(--acc);color:#fff;border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px}
.timer .x{width:40px;height:40px;border-radius:99px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.timer.over .t{color:var(--org)}
/* modales */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.full{max-height:100vh;height:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top))}
.hero{font-weight:700;font-size:26px;letter-spacing:-.4px;line-height:1.15;margin-bottom:6px}
.done-hero{text-align:center;margin-bottom:22px}
.done-hero .ring{width:96px;height:96px;margin:0 auto 18px;border-radius:99px;border:4px solid var(--acc);display:flex;align-items:center;justify-content:center;color:var(--acc);box-shadow:0 0 40px rgba(59,130,246,.45)}
.done-hero .ring svg.i{width:52px;height:52px;stroke-width:3}
.done-hero .t{font-size:28px;font-weight:700}
.done-hero .m{color:var(--mut);margin-top:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:var(--acc);color:#fff;font-weight:600;padding:12px 18px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .35s ease;text-align:center;max-width:92vw}
@keyframes pop{0%{transform:translate(-50%,-20px) scale(.9);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat .ico{font-size:22px;height:28px}
.stat .l{font-size:13px;color:var(--mut);margin-top:6px}
.stat .v{font-weight:700;font-size:24px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--mut);margin-top:2px}
.pr-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr-row:first-child{border-top:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:8px 0 22px}
.bars div{flex:1;background:var(--card2);border-radius:6px 6px 3px 3px;position:relative}
.bars div.ok,.bars div.has{background:var(--acc)}
.bars div.has:not(.ok){opacity:.55}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.best{display:flex;align-items:center;gap:14px}
.best .tro{font-size:34px}
.best .v{font-size:26px;font-weight:700}
.up{color:var(--lime);font-size:14px;font-weight:600}
/* réglages */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);gap:10px}
.set-row:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:32px;height:32px;border-radius:99px;background:var(--card2);font-size:18px;display:flex;align-items:center;justify-content:center}
.stepper .v{min-width:40px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.prow:first-child{border-top:0}
.prow .grow{flex:1}
.prow .tile{width:40px;height:40px;border-radius:11px}
.ed-ex{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ed-row{display:grid;grid-template-columns:repeat(4,1fr) 40px;gap:6px;align-items:end}
.ed-row label{font-size:10px;color:var(--mut);display:block;margin-bottom:2px}
.ed-row input,.ed-row select{padding:8px 6px;font-size:15px}
.x{color:var(--red);font-size:18px;height:38px}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.fl{font-size:13px;color:var(--mut);margin:12px 0 5px;display:block}
.daybar{display:flex;gap:8px;align-items:center}
.daybar input{font-weight:700}
.chkrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.chkrow input{width:22px;height:22px;flex:none}
.next-title{font-weight:700;font-size:28px;margin:2px 0 6px}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
/* ================= PROGRAMME PAR DÉFAUT ================= */
const DEFAULT_PROGRAM = [
 {id:"UA", name:"Upper A", ex:[

 {id:"UB", name:"Upper B", ex:[

 {id:"LB", name:"Lower B", ex:[
  {id:"squat",name:"Hack squat / goblet squat",sets:3,min:6,max:10,inc:2.5,unit:"reps"},
  {id:"sdt_jt",name:"Soulevé de terre jambes tendues haltères",sets:3,min:8,max:10,inc:2,unit:"reps",note:"Charge légère, dos neutre, progression lente"},
  {id:"lc_allonge",name:"Leg curl allongé",sets:3,min:10,max:15,inc:2.5,unit:"reps"},
  {id:"bulgares",name:"Fentes bulgares (par jambe)",sets:2,min:8,max:12,inc:2,unit:"reps"},

/* ================= STOCKAGE CLOUD ================= */
let db = null;
const writers = {};
function writeDoc(path, data){            // une écriture à la fois par document, la plus récente gagne
  if(!db) return;
  const w = writers[path] || (writers[path] = {busy:false, next:undefined});
  w.next = data;
  if(w.busy) return;
  (async () => {
    w.busy = true;
    while(w.next !== undefined){
      const d = w.next; w.next = undefined;
      try{ if(d === null) await db.doc(path).delete(); else await db.doc(path).set(d); }
      catch(e){ if(e && e.code === "quota_exceeded") showToast("Stockage plein : exporte puis supprime de vieilles séances", true); }
    }
    w.busy = false;
  })();
}
function saveConfig(){ saveLocal(); writeDoc("app/config", clone(S.config)); }
function saveDraft(){ saveLocal(); writeDoc("app/draft", S.draft ? {draft: clone(S.draft)} : null); }

async function initDb(){
  const timeout = setTimeout(() => { if(S.sync === "connecting"){ S.sync = "slow"; render(); } }, 10000);
  if(!(window.claude && window.claude.use)){ clearTimeout(timeout); S.sync = "local"; render(); return; }
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db){ clearTimeout(timeout); S.sync = "local"; render(); return; }
  let cfgOk = false, sesOk = false;
  const done = () => { if(cfgOk && sesOk){ clearTimeout(timeout); S.sync = "cloud"; } };
  db.doc("app/config").onSnapshot(snap => {
    if(snap.exists){ S.config = normConfig(clone(snap.data())); }
    if(!snap.metadata.fromCache){ cfgOk = true; done(); }
    saveLocal(); render();
  }, () => { S.sync = "local"; render(); });
  db.collection("sessions").onSnapshot(snap => {
    const remote = snap.docs.map(d => clone(d.data())).filter(s => s && s.id);
    if(!snap.metadata.fromCache){
      sesOk = true; done();
      // migration : séances locales jamais envoyées
      const ids = new Set(remote.map(s => s.id));
      S.sessions.filter(s => !ids.has(s.id)).forEach(s => { writeDoc("sessions/" + s.id, s); remote.push(s); });
    }
    S.sessions = remote.sort((a,b) => b.date - a.date);
    saveLocal(); render();
  }, () => { S.sync = "local"; render(); });
  try{
    const ds = await db.doc("app/draft").get();
    if(ds.exists && !S.draft && ds.data().draft){ S.draft = clone(ds.data().draft); saveLocal(); render(); }
  }catch(e){}
}

function history(exId){            // entrées passées, de la plus récente à la plus ancienne
  const out = [];
  for(const s of S.sessions){ const e = (s.entries||[]).find(x => x.exId === exId); if(e && e.sets && e.sets.length) out.push({...e, date:s.date}); }
  return out;
}
function entryBest(e){ return Math.max(0, ...e.sets.map(s => e.unit === "sec" ? s.r : (e1rm(s.w, s.r) || s.r))); }
function entryMaxW(e){ return Math.max(0, ...e.sets.map(s => s.w || 0)); }

function computeTarget(ex, last){
  if(ex.unit === "routine") return {type:"routine", sets:null};
  if(!last) return {type:"first", sets:null};
  const ls = last.sets.slice();
  while(ls.length < ex.sets) ls.push({...ls[ls.length-1]});
  const base = ls.slice(0, ex.sets).map(s => ({w:s.w, r:s.r}));
  if(last.feel === "pain") return {type:"hold", sets:base};
  const topW = Math.max(...base.map(s => s.w));
  const allTop = last.sets.length >= ex.sets && base.every(s => s.r >= ex.max && s.w >= topW);
  if(allTop){
    if(ex.unit === "sec") return {type:"reps", sets: base.map(s => ({w:s.w, r:s.r + 5}))};
    if(ex.inc > 0) return {type:"load", sets: base.map(() => ({w: topW + ex.inc, r: ex.min}))};
    return {type:"reps", sets: base.map(s => ({w:s.w, r:s.r + 1}))};
  }
  const t = base.map(s => ({w:s.w, r:s.r}));
  let idx = -1, low = Infinity;
  t.forEach((s,i) => { if(s.r < ex.max && s.r < low){ low = s.r; idx = i; } });
  if(idx >= 0) t[idx].r += ex.unit === "sec" ? 5 : 1;
  return {type:"reps", sets:t};
}
function targetText(ex, tg){
  const u = ex.unit === "sec" ? "s" : "";
  if(tg.type === "routine") return `⏱️ ${ex.min} min : coche quand c'est fait`;
  if(tg.type === "first") return "🆕 Première fois : trouve une charge où tu finis à 2–3 reps de l'échec";
  const reps = tg.sets.map(s => s.r + u).join(" · ");
  const w = tg.sets[0].w;
  if(tg.type === "load") return `🔥 Objectif : ${fmt(w)} kg × ${ex.min}+ — tu montes en charge !`;
  if(tg.type === "hold") return `⚠️ Douleur la dernière fois : même charge (${w ? fmt(w)+" kg" : "PDC"}), technique d'abord`;
  return `🎯 Objectif : ${w ? fmt(w)+" kg × " : ""}${reps}`;
}
function stagnation(exId){
  const h = history(exId); if(h.length < 4 || h[0].unit === "routine") return false;
  const bests = h.map(entryBest);          // [récent ... ancien]
  const recent = Math.max(...bests.slice(0,3)); const before = Math.max(...bests.slice(3));
  return recent <= before;
}
function allExercises(){
  const m = new Map();
  S.config.program.forEach(d => d.ex.forEach(e => {
    if(hasVar(e)) e.variants.forEach((v,i) => { const k = exKey(e,i); if(!m.has(k)) m.set(k, {id:k, name:exLabel(e,i), unit:e.unit}); });
    else if(!m.has(e.id)) m.set(e.id, e);
  }));
  S.sessions.forEach(s => (s.entries||[]).forEach(e => { if(!m.has(e.exId)) m.set(e.exId, {id:e.exId, name:e.name, unit:e.unit}); }));
  return [...m.values()];
}
function weekCount(ws){ return S.sessions.filter(s => weekStart(s.date) === ws).length; }
function streakInfo(){
  const goal = S.config.weeklyGoal; let ws = weekStart(Date.now());
  const cur = weekCount(ws); let streak = cur >= goal ? 1 : 0;
  let p = prevWeek(ws);
  while(weekCount(p) >= goal){ streak++; p = prevWeek(p); }
  return {cur, streak, goal};
}

function tileFig(name, h){ const m = musclesOf(name); return figure(new Set(m), m.length && BACK_ONLY.has(m[0]) ? "back" : "front", h); }
function miniTarget(ex, tg){
  if(tg.type === "routine") return `<div class="tg-mini" style="color:var(--blue)">⏱️ ${ex.min} min</div>`;
  if(tg.type === "first") return `<div class="tg-mini" style="color:var(--blue)">🆕 Premier essai</div>`;

}

/* ================= VARIANTES & SUPERSETS ================= */
const hasVar = ex => !!(ex.variants && ex.variants.length);
function exKey(ex, vi){ return hasVar(ex) ? ex.id + "~" + ex.variants[Math.min(vi||0, ex.variants.length-1)].id : ex.id; }
function exLabel(ex, vi){ return hasVar(ex) ? ex.name + " · " + ex.variants[Math.min(vi||0, ex.variants.length-1)].name : ex.name; }
function lastVariant(ex){
  if(!hasVar(ex)) return 0;
  for(const s of S.sessions) for(const e of (s.entries||[])){ const i = ex.variants.findIndex(v => ex.id + "~" + v.id === e.exId); if(i >= 0) return i; }
  return 0;
}
function programKeys(){ const k = new Set(); S.config.program.forEach(d => d.ex.forEach(ex => { if(hasVar(ex)) ex.variants.forEach((v,i) => k.add(exKey(ex,i))); else k.add(ex.id); })); return k; }
function makeEntry(ex, vi){
  const id = exKey(ex, vi), last = history(id)[0], tg = computeTarget(ex, last);
  const startW = (hasVar(ex) ? ex.variants[Math.min(vi||0, ex.variants.length-1)].startW : ex.startW) || 0;
  const sets = [];
  const n = ex.unit === "routine" ? 1 : ex.sets;
  for(let i=0;i<n;i++){ const t = tg.sets ? tg.sets[i] : null; sets.push({ w: t ? t.w : startW, r: t ? t.r : ex.min, done:false }); }
  return { exId:id, baseId:ex.id, vi:vi||0, variants: hasVar(ex) ? clone(ex.variants) : null, name: exLabel(ex, vi), baseName: ex.name,
    unit:ex.unit, min:ex.min, max:ex.max, inc:ex.inc, note:ex.note||"", nSets:ex.sets, ss: !!ex.ss, target: tg, sets, feel:null };
}
function parseVariants(str, old){
  const names = String(str||"").split(",").map(s => s.trim()).filter(Boolean);
  if(names.length < 2) return null;
  return names.map(n => { const o = (old||[]).find(v => v.name.toLowerCase() === n.toLowerCase()); return o ? {id:o.id, name:n} : {id:"v" + uid().slice(-6), name:n}; });
}

/* ================= SÉANCE ================= */
function startWorkout(dayIdx){
  const day = S.config.program[dayIdx];
  S.draft = { dayIdx, dayId:day.id, dayName:day.name, start:Date.now(),
    entries: day.ex.map(ex => makeEntry(ex, lastVariant(ex)))
  };
  S.view = "workout"; S.pickIdx = null; saveDraft(); render(); window.scrollTo(0,0);
}
function checkSet(ei, si){
  const e = S.draft.entries[ei], s = e.sets[si];
  s.done = !s.done;
  let toasted = false;
  if(s.done){
    // record ?
    const h = history(e.exId);
    if(h.length && e.unit !== "routine"){
      const prevBest = Math.max(...h.map(entryBest));
      const prevMaxW = Math.max(...h.map(entryMaxW));
      const others = e.sets.filter((x,i) => x.done && i !== si);
      const curBestOthers = Math.max(0, ...others.map(x => e.unit === "sec" ? x.r : (e1rm(x.w,x.r) || x.r)));
      const val = e.unit === "sec" ? s.r : (e1rm(s.w, s.r) || s.r);
      if(s.w > prevMaxW && s.w > Math.max(0, ...others.map(x => x.w))) toasted = true, showToast(`🏆 Record de charge : ${fmt(s.w)} kg !`);
      else if(val > prevBest && val > curBestOthers) toasted = true, showToast(e.unit === "sec" ? `🏆 Record : ${s.r} s !` : `🏆 Record ! 1RM estimé ${fmt(Math.round(val*2)/2)} kg`);
      else if(e.target.sets && e.target.sets[si] && s.w >= e.target.sets[si].w && s.r >= e.target.sets[si].r) toasted = true, showToast("✅ Objectif de la série atteint");
    }
    const nxt = S.draft.entries[ei+1];
    if(e.ss && nxt){ stopTimer(); if(!toasted) showToast("➡️ Enchaîne direct : " + (nxt.baseName || nxt.name)); }
    else if(e.unit === "routine"){ stopTimer(); showToast("💪 Routine abdos validée"); }
    else startTimer();
  }
  saveDraft(); render();
}
function entryGoalHit(e){
  if(!e.target || !e.target.sets) return null;
  const done = e.sets.filter(s => s.done);
  if(done.length < e.target.sets.length) return false;
  return e.target.sets.every((t,i) => done[i].w >= t.w && done[i].r >= t.r);
}
function finishWorkout(){
  const d = S.draft;
  const entries = d.entries.map(e => ({ exId:e.exId, name:e.name, unit:e.unit, feel:e.feel,
    sets: e.sets.filter(s => s.done).map(s => ({w:+s.w||0, r:+s.r||0})), goal: entryGoalHit(e) }))
    .filter(e => e.sets.length);
  if(!entries.length){ S.confirm = "abandon"; render(); return; }
  const prs = [];
  entries.forEach(e => {
    const h = history(e.exId); if(!h.length) return;
    const b = entryBest(e), pb = Math.max(...h.map(entryBest));
    const w = entryMaxW(e), pw = Math.max(...h.map(entryMaxW));
    if(w > pw) prs.push({name:e.name, txt:`${fmt(w)} kg (avant ${fmt(pw)})`});
    else if(b > pb) prs.push({name:e.name, txt: e.unit === "sec" ? `${b} s` : `1RM est. ${fmt(Math.round(b*2)/2)} kg (+${fmt(Math.round((b-pb)*2)/2)})`});
  });
  const volume = entries.reduce((a,e) => a + e.sets.reduce((x,s) => x + (e.unit === "sec" ? 0 : s.w*s.r), 0), 0);
  const goals = d.entries.map(entryGoalHit).filter(g => g !== null);
  const prevSame = S.sessions.find(s => s.dayId === d.dayId);
  const session = { id: uid(), date: Date.now(), dayId:d.dayId, dayName:d.dayName, entries, prs,
    volume: Math.round(volume), goalsHit: goals.filter(Boolean).length, goalsTotal: goals.length,
    sets: entries.reduce((a,e) => a + e.sets.length, 0), durationMin: Math.round((Date.now()-d.start)/60000) };
  S.sessions = [session, ...S.sessions];
  writeDoc("sessions/" + session.id, session);
  S.config.nextIdx = (d.dayIdx + 1) % S.config.program.length;
  saveConfig();
  S.draft = null; saveDraft(); stopTimer();
  S.view = "home";
  S.modal = {type:"summary", session, prevVol: prevSame ? prevSame.volume : null};
  render(); window.scrollTo(0,0);
}

function claudeSummary(){
  const lines = ["GYM TRACKER — export pour Claude (" + new Date().toLocaleDateString("fr-BE") + ")", "", "PROGRAMME"];
  S.config.program.forEach(d => lines.push("- " + d.name + " : " + d.ex.map(e => e.name + " " + e.sets + "×" + e.min + "-" + e.max).join(" | ")));
  lines.push("", "SÉANCES (récentes d'abord)");
  S.sessions.slice(0, 30).forEach(s => {
    lines.push("", dayFr(s.date) + " — " + s.dayName + (s.durationMin ? " (" + s.durationMin + " min)" : "") + (s.goalsTotal ? " · objectifs " + s.goalsHit + "/" + s.goalsTotal : "") + ((s.prs||[]).length ? " · records : " + s.prs.map(p => p.name).join(", ") : ""));
    (s.entries||[]).forEach(e => lines.push("  " + e.name + " : " + e.sets.map(x => (x.w ? fmt(x.w) + "kg×" : "") + x.r + (e.unit === "sec" ? "s" : e.unit === "routine" ? " min" : "")).join(", ") + (e.feel ? " [" + ({easy:"facile",ok:"correct",hard:"dur",pain:"DOULEUR"})[e.feel] + "]" : "")));
  });

}

  if(!S.sessions.length) h += `<div class="mut small">Aucune séance pour l'instant. La première pose les bases : tout ce que tu notes servira à calculer tes prochains objectifs.</div>`;
  else h += S.sessions.slice(0,8).map(s => `<button class="list-item" data-a="detail" data-v="${esc(s.id)}">

}

function lineChart(points, unit){
  if(points.length < 2) return `<div class="mut small" style="padding:20px 0">Le graphique apparaît après 2 séances sur cet exercice.</div>`;
  const W = 340, H = 160, P = 26;
  const ys = points.map(p => p.v), mn = Math.min(...ys), mx = Math.max(...ys), rg = (mx - mn) || 1;
  const X = i => P + i * (W - P - 10) / (points.length - 1);
  const Y = v => H - 20 - (v - mn) / rg * (H - 40);
  const line = points.map((p,i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const grid = [0, .5, 1].map(f => { const v = mn + f*rg, y = Y(v); return `<line x1="${P}" x2="${W-6}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="0" y="${y+4}" style="fill:var(--mut)" font-size="10">${fmt(Math.round(v))}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <polygon points="${X(0)},${H-20} ${line} ${X(points.length-1)},${H-20}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="#3B82F6"/>`).join("")}
    <text x="${P}" y="${H-4}" style="fill:var(--mut)" font-size="10">${dateFr(points[0].d)}</text>
    <text x="${W-6}" y="${H-4}" style="fill:var(--mut)" font-size="10" text-anchor="end">${dateFr(points[points.length-1].d)}</text>
  </svg>`;
}

function weekNum(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(),0,4); return 1 + Math.round(((d - w1)/DAY - 3 + ((w1.getDay()+6)%7))/7); }

function renderProgress(){
  const goal = S.config.weeklyGoal;
  let ws = weekStart(Date.now()); const weeks = [];
  for(let i=0;i<8;i++){ weeks.unshift({ws, n:weekCount(ws)}); ws = prevWeek(ws); }
  const maxN = Math.max(goal, ...weeks.map(w => w.n));
  const monthPR = S.sessions.filter(s => s.date > Date.now() - 30*DAY).reduce((a,s) => a + (s.prs||[]).length, 0);
  const real = S.sessions.filter(s => s.dayId !== "BASE").length;
  let h = `<div class="page-title"><h1>Progrès</h1><span class="mut">${IC.chart}</span></div>
    <div class="grid2" style="margin-bottom:16px">
      <div class="stat"><div class="ico">🏋️</div><div class="l">Séances au total</div><div class="v">${real}</div></div>
      <div class="stat"><div class="ico">⭐</div><div class="l">Records (30 j)</div><div class="v">${monthPR}</div></div></div>
    <div class="sec-title">Séances par semaine</div>
    <div class="card"><div class="bars">${weeks.map(w => `<div class="${w.n>=goal?"ok":w.n?"has":""}" style="height:${Math.max(5, w.n/maxN*100)}%"><span>S${weekNum(w.ws)}</span></div>`).join("")}</div></div>`;

  const exs = allExercises();
  if(!S.progEx || !exs.some(e => e.id === S.progEx)){ const withH = exs.find(e => history(e.id).length); S.progEx = (withH || exs[0]).id; }
  const ex = exs.find(e => e.id === S.progEx);
  const hist = history(ex.id);
  const isSec = ex.unit === "sec";
  h += `<select data-in="progsel" style="margin-bottom:16px;font-weight:600;background:var(--card)">${exs.map(e => `<option value="${esc(e.id)}" ${e.id===ex.id?"selected":""}>${esc(e.name)}${history(e.id).length?"":" (pas encore fait)"}</option>`).join("")}</select>`;
  if(hist.length){
    const pts = hist.slice().reverse().map(e => ({v: entryBest(e), d: e.date}));
    const best = Math.max(...pts.map(p => p.v)), first = pts[0].v;
    const gain = first ? (best/first - 1) * 100 : 0;
    h += `<div class="card"><div class="best"><span class="tro">🏆</span><div><div class="mut small">${isSec?"Meilleur temps":"Meilleur 1RM estimé"}</div>
        <div class="v">${fmt(Math.round(best*2)/2)} ${isSec?"s":"kg"}</div><div class="up">↗ ${gain>=0?"+":""}${fmt(Math.round(gain))} % depuis le début</div></div></div></div>
      ${stagnation(ex.id) ? `<div class="target hold" style="margin:-4px 0 16px">Stagnation sur les 3 dernières séances</div>` : ""}
      <div class="sec-title">Progression (${isSec?"temps":"1RM estimé"})</div>
      <div class="card">${lineChart(pts, isSec?"s":"kg")}</div>
      <div class="sec-title">Dernières séances</div>
      <div class="card">${hist.slice(0,8).map(e => `<div class="list-item"><span class="small">${dayFr(e.date)}</span><span class="small mut" style="text-align:right">${e.sets.map(s => (s.w?fmt(s.w)+"×":"") + s.r + (isSec?"s":"")).join(" · ")}</span></div>`).join("")}</div>`;
  } else h += `<div class="card mut small">Pas encore de données sur cet exercice.</div>`;
  return h;
}

document.addEventListener("click", ev => {
  const stop = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-a]");
  if(!el) return;
  if(stop && !stop.contains(el) ) return;
  if(stop && el.classList.contains("ov")) return;
  const a = el.dataset.a, v = el.dataset.v;
  const ei = +el.dataset.e, si = +el.dataset.s;
  if(a !== "import" && a !== "delsession" && a !== "exdel") S.confirm = S.confirm === "abandon" && a !== "abandon" && a !== "closeconfirm" ? S.confirm : (a === "askabandon" ? "abandon" : null);
  switch(a){
    case "nav": S.view = v; S.editProg = null; window.scrollTo(0,0); break;
    case "start": startWorkout(+v); return;
    case "pick": S.pickIdx = +v; break;
    case "editnav": S.view = "settings"; S.editProg = clone(S.config.program); window.scrollTo(0,0); break;
    case "resume": S.view = "workout"; window.scrollTo(0,0); break;
    case "st": {
      const e = S.draft.entries[ei], s = e.sets[si], d = +el.dataset.d;
      if(el.dataset.f === "w"){ const step = e.inc >= 2.5 || e.inc === 0 ? 2.5 : e.inc >= 2 ? 2 : 1; s.w = Math.max(0, Math.round((s.w + d*step)*100)/100); }
      else s.r = Math.max(0, s.r + d * (e.unit === "sec" ? 5 : 1));
      saveDraft(); break;
    }
    case "chk": checkSet(ei, si); return;
    case "addset": { const e = S.draft.entries[ei]; const l = e.sets[e.sets.length-1] || {w:0, r:e.min}; e.sets.push({w:l.w, r:l.r, done:false}); saveDraft(); break; }
    case "feel": { const e = S.draft.entries[ei]; e.feel = e.feel === v ? null : v; saveDraft(); if(v === "pain" && e.feel) showToast("Noté. Pas d'augmentation sur cet exercice la prochaine fois. Si ça persiste, vois un kiné.", true); break; }
    case "delset": {
      const e = S.draft.entries[ei]; if(e.sets.length < 2) break;
      let k = -1; for(let i=e.sets.length-1;i>=0;i--) if(!e.sets[i].done){ k = i; break; }
      e.sets.splice(k >= 0 ? k : e.sets.length-1, 1); saveDraft(); break;
    }
    case "exedit": { const e = S.draft.entries[ei];
      S.modal = {type:"exedit", ei, f:{name:e.baseName || e.name, sets:e.nSets, min:e.min, max:e.max, inc:e.inc, note:e.note||"", unit:e.unit, variants:(e.variants||[]).map(v => v.name).join(", "), ss:!!e.ss}}; break; }
    case "exadd": S.modal = {type:"exedit", ei:-1, f:{name:"", sets:3, min:8, max:12, inc:2.5, note:"", unit:"reps", variants:"", ss:false}}; break;
    case "exsave": {
      const f = S.modal.f, name = String(f.name).trim();
      if(!name){ showToast("Donne un nom à l'exercice", true); return; }
      if(f.min > f.max){ showToast("Reps min doit être ≤ reps max", true); return; }
      const sets = Math.max(1, Math.min(10, f.sets|0));
      const day = S.config.program[S.draft.dayIdx];
      if(S.modal.ei >= 0){
        const ei2 = S.modal.ei, e = S.draft.entries[ei2];
        let px = day && day.ex.find(x => x.id === (e.baseId || e.exId));
        if(!px){ px = {id:e.baseId || e.exId, unit:e.unit}; }
        const vars = parseVariants(f.variants, px.variants);
        Object.assign(px, {name, sets, min:f.min, max:f.max, inc:f.inc, note:f.note, ss:!!f.ss});
        if(vars) px.variants = vars; else delete px.variants;
        if(!e.sets.some(s => s.done)) S.draft.entries[ei2] = makeEntry(px, vars ? Math.min(e.vi||0, vars.length-1) : 0);
        else Object.assign(e, {baseName:name, name:exLabel(px, e.vi||0), nSets:sets, min:f.min, max:f.max, inc:f.inc, note:f.note, ss:!!f.ss});
      } else {
        const ex = {id:"ex_" + uid(), name, sets, min:f.min, max:f.max, inc:f.inc, unit:"reps", note:f.note, ss:!!f.ss};
        const vars = parseVariants(f.variants, null); if(vars) ex.variants = vars;
        if(day) day.ex.push(ex);
        S.draft.entries.push(makeEntry(ex, 0));
      }
      saveConfig(); saveDraft(); S.modal = null; showToast("Enregistré ✅"); break;
    }
    case "variant": {
      const e = S.draft.entries[ei], i = +v; if(i === e.vi) break;
      if(e.sets.some(s => s.done)){ showToast("Décoche tes séries avant de changer de variante", true); return; }
      const day = S.config.program[S.draft.dayIdx], px = day && day.ex.find(x => x.id === e.baseId);
      if(!px) break;
      S.draft.entries[ei] = makeEntry(px, i); saveDraft(); break;
    }
    case "exskip": S.draft.entries.splice(S.modal.ei, 1); saveDraft(); S.modal = null; break;
    case "exdel": {
      if(S.confirm !== "exdel"){ S.confirm = "exdel"; break; }
      const e = S.draft.entries[S.modal.ei], day = S.config.program[S.draft.dayIdx];
      if(day) day.ex = day.ex.filter(x => x.id !== (e.baseId || e.exId));
      S.draft.entries.splice(S.modal.ei, 1);
      saveConfig(); saveDraft(); S.modal = null; S.confirm = null; showToast("Supprimé du programme"); break;
    }
    case "finish": finishWorkout(); return;
    case "askabandon": S.confirm = "abandon"; break;
    case "abandon": S.draft = null; S.confirm = null; saveDraft(); stopTimer(); S.view = "home"; break;
    case "closeconfirm": S.confirm = null; break;
    case "t30": if(S.timer){ S.timer.end += 30000; S.timer.buzzed = false; } break;
    case "tstop": stopTimer(); break;
    case "closemodal": S.modal = null; S.confirm = null; break;
    case "detail": S.modal = {type:"detail", id:v}; break;
    case "delsession":
      if(S.confirm === "del"){ const id = S.modal.id; S.sessions = S.sessions.filter(s => s.id !== id); writeDoc("sessions/" + id, null); saveLocal(); S.modal = null; S.confirm = null; showToast("Séance supprimée"); }
      else S.confirm = "del";
      break;
    case "prog": S.view = "progress"; S.progEx = v; window.scrollTo(0,0); break;
    case "editprog": S.editProg = clone(S.config.program); break;
    case "cancelprog": S.editProg = null; break;
    case "addex": S.editProg[+el.dataset.d].ex.push({id:"ex_"+uid(), name:"Nouvel exercice", sets:3, min:8, max:12, inc:2.5, unit:"reps"}); break;
    case "delex": S.editProg[+el.dataset.d].ex.splice(+el.dataset.x, 1); break;
    case "delday": S.editProg.splice(+el.dataset.d, 1); break;
    case "addday": S.editProg.push({id:"day_"+uid(), name:"Nouvelle séance", ex:[]}); break;
    case "saveprog": S.config.program = S.editProg; S.editProg = null; S.config.nextIdx %= S.config.program.length; saveConfig(); showToast("Programme enregistré"); break;
    case "goalstep": S.config.weeklyGoal = Math.max(1, Math.min(7, S.config.weeklyGoal + (+v))); saveConfig(); break;
    case "reststep": S.config.restSec = Math.max(30, Math.min(300, S.config.restSec + (+v))); saveConfig(); break;
    case "setnext": S.config.nextIdx = +v; saveConfig(); break;
    case "claude": {
      const txt = claudeSummary();
      navigator.clipboard.writeText(txt).then(() => showToast("Copié ✅ Colle-le dans Claude"), () => { S.importText = txt; render(); showToast("Copie bloquée : sélectionne le texte ci-dessous", true); });
      return;
    }
    case "export": {
      const txt = JSON.stringify({app:"gymtracker", v:1, config:S.config, sessions:S.sessions});
      navigator.clipboard.writeText(txt).then(() => showToast("Sauvegarde copiée ✅"), () => { S.importText = txt; render(); showToast("Copie bloquée : sélectionne le texte ci-dessous", true); });
      return;
    }
    case "import": {
      let data; try{ data = JSON.parse(S.importText); }catch(e){ showToast("Sauvegarde illisible", true); S.confirm = null; break; }
      if(!data || data.app !== "gymtracker" || !Array.isArray(data.sessions)){ showToast("Ce n'est pas une sauvegarde Gym Tracker", true); S.confirm = null; break; }
      if(S.confirm !== "import"){ S.confirm = "import"; break; }
      S.confirm = null;
      const ids = new Set(data.sessions.map(s => s.id));
      S.sessions.filter(s => !ids.has(s.id)).forEach(s => writeDoc("sessions/" + s.id, null));
      data.sessions.forEach(s => writeDoc("sessions/" + s.id, s));
      S.sessions = data.sessions.slice().sort((a,b) => b.date - a.date);
      S.config = normConfig(data.config); saveConfig(); S.importText = "";
      showToast("Sauvegarde restaurée ✅"); break;
    }
  }
  render();
});
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset.in; if(!k) return;
  const num = x => parseFloat(String(x).replace(",", "."));
  if(k === "w" || k === "r"){
    const s = S.draft.entries[+el.dataset.e].sets[+el.dataset.s];
    const n = num(el.value); if(!isNaN(n)){ s[k] = Math.max(0, k === "r" ? Math.round(n) : n); saveLocal(); }
  } else if(k === "me"){
    const f = el.dataset.f;
    if(f === "ss") S.modal.f.ss = el.checked;
    else if(f === "name" || f === "note" || f === "variants") S.modal.f[f] = el.value;
    else { const n = num(el.value); if(!isNaN(n)) S.modal.f[f] = f === "inc" ? Math.max(0, n) : Math.max(0, Math.round(n)); }
  } else if(k === "import") S.importText = el.value;
  else if(k === "pday") S.editProg[+el.dataset.d].name = el.value;
  else if(k === "pex"){
    const e = S.editProg[+el.dataset.d].ex[+el.dataset.x], f = el.dataset.f;
    if(f === "name") e.name = el.value; else { const n = num(el.value); if(!isNaN(n)) e[f] = f === "inc" ? n : Math.max(1, Math.round(n)); }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target, k = el.dataset.in; if(!k) return;
  const n = parseInt(el.value, 10);
  if(k === "w" || k === "r") saveDraft();
  if(k === "goal" && n > 0 && n < 15){ S.config.weeklyGoal = n; saveConfig(); render(); }
  if(k === "rest" && n >= 15){ S.config.restSec = n; saveConfig(); }
  if(k === "progsel"){ S.progEx = el.value; render(); }
});

/* ================= DÉMARRAGE ================= */
loadLocal();
if(S.draft) S.view = "home";
S.sync = "device";
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
