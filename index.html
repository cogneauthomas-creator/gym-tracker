<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Tracker</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F7; --card:#FFFFFF; --card2:#EEF1F5; --line:#E4E7EC;
  --txt:#0B0F14; --mut:#6B7280; --acc:#3B82F6; --acc-d:#2563EB;
  --lime:#16A34A; --org:#F59E0B; --red:#EF4444; --blue:#0EA5E9;
  --accbg:#E7F0FE; --okbg:#E7F6EC; --redbg:#FDECEC; --orgbg:#FEF3E2;
  --fig:#CDD3DC; --figon:#3B82F6; --navbg:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --glow:none;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0F14; --card:#1A1F26; --card2:#111827; --line:#262D37;
    --txt:#FFFFFF; --mut:#A0A6B3; --acc:#3B82F6; --acc-d:#2563EB;
    --lime:#22C55E; --org:#F59E0B; --red:#EF4444; --blue:#38BDF8;
    --accbg:#14243F; --okbg:#0F2A1B; --redbg:#2D1517; --orgbg:#2C2213;
    --fig:#3A424E; --figon:#60A5FA; --navbg:rgba(11,15,20,.88);
    --shadow:none; --glow:0 0 24px rgba(59,130,246,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;color:var(--txt);background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px;font-size:16px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.mut{color:var(--mut)} .small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{font-size:17px;font-weight:600;margin:22px 2px 10px}
.page-title{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 16px}
.page-title h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0}
.page-title .ic-btn{color:var(--txt)}
/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:600;font-size:17px;text-align:center}
.btn.main{background:var(--acc);color:#fff;box-shadow:var(--glow)}
.btn.main:active{background:var(--acc-d)}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{height:46px;font-size:15px;border-radius:14px}
.btn svg.i{width:20px;height:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:99px;background:var(--card2);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
/* accueil */
.wk-top{display:flex;justify-content:space-between;align-items:flex-start}
.wk-lbl{font-size:16px;color:var(--mut);font-weight:500}
.wk-big{font-size:32px;font-weight:700;letter-spacing:-.6px;margin-top:6px}
.wk-big .of{color:var(--mut)}
.circles{display:flex;gap:14px;margin-top:14px}
.circ{width:34px;height:34px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.circ.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--glow)}
.circ svg.i{width:18px;height:18px;stroke-width:3}
.streak-row{display:flex;align-items:center;gap:10px;margin-top:16px;padding:14px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px}
.streak-row .grow{flex:1}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;padding:0 16px;border-radius:99px;background:var(--card);color:var(--txt);font-weight:600;font-size:15px;white-space:nowrap;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.tab.on{background:var(--acc);color:#fff;box-shadow:var(--glow)}
.tab .nx{width:6px;height:6px;border-radius:9px;background:currentColor;opacity:.9}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan-title{font-size:30px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.more{width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.plan-sub{font-size:15px;color:var(--mut);margin-top:4px}
.teaser{font-size:14px;font-weight:600;color:var(--lime);margin-top:8px}
.body-fig{display:flex;gap:2px;flex:none;filter:drop-shadow(0 0 10px rgba(59,130,246,.18))}
.exlist{margin:6px 0 14px}
.exrow{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.exrow:first-child{border-top:0}
.exrow .grow{flex:1;min-width:0}
.exrow .chev{color:var(--mut)}
.tile{width:52px;height:52px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.tile.sm{width:44px;height:44px;border-radius:12px}
.exname{font-weight:600;font-size:17px;line-height:1.25}
.exsub{font-size:14px;color:var(--mut);margin-top:2px}
.tg-mini{font-size:14px;font-weight:500;margin-top:4px;color:var(--mut)}
.pls{display:flex;gap:8px;margin-top:8px}
.pls span{background:var(--card2);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.duo .card{margin:0;padding:14px}
.mini-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:8px}
.mini-v{font-size:20px;font-weight:700}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left;gap:10px}
.list-item:first-of-type{border-top:0}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--orgbg);color:var(--org);white-space:nowrap}
.badge.lime{background:var(--okbg);color:var(--lime)}
.badge.red{background:var(--redbg);color:var(--red)}
.alert{background:var(--orgbg)}
.h{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:8px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav-in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.nav button svg.i{width:26px;height:26px;stroke-width:1.8}
.nav button.on{color:var(--acc)}
/* séance */
.wk-head{position:sticky;top:0;z-index:5;background:var(--bg);margin:calc(-12px - env(safe-area-inset-top)) -16px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
.wk-nav{display:grid;grid-template-columns:44px 1fr auto;align-items:center}
.wk-nav .ttl{text-align:center;font-weight:600;font-size:18px}
.btn-end{background:var(--red);color:#fff;font-weight:600;font-size:15px;padding:8px 14px;border-radius:12px}
.wk-clock{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.wk-clock .t{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.wk-clock .s{font-size:17px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.exhead{display:flex;align-items:center;gap:12px}
.exhead .grow{flex:1;min-width:0}
.editbtn{width:36px;height:36px;border-radius:10px;color:var(--txt);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;height:40px;border-radius:99px;font-weight:600;font-size:14px;background:var(--card2);color:var(--txt)}
.seg button.on{background:var(--acc);color:#fff}
.ex-note{font-size:13px;color:var(--org);margin-top:10px}
.last{font-size:15px;margin-top:12px}
.target{margin-top:12px;padding:13px 14px;border-radius:14px;font-size:16px;font-weight:600;background:var(--accbg);color:var(--txt);border:1px solid rgba(59,130,246,.25)}
.target.load{background:var(--orgbg);border-color:rgba(245,158,11,.3)}
.target.first,.target.routine{background:var(--card2);border-color:var(--line)}
.target.hold{background:var(--redbg);border-color:rgba(239,68,68,.3)}
.sets{margin-top:12px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center;padding:6px 0;transition:opacity .2s}
.set .idx{font-weight:600;font-size:15px;text-align:center;color:var(--txt)}
.stp{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;height:44px;overflow:hidden}
.stp button{width:30px;height:100%;font-size:20px;color:var(--mut);flex:none}
.stp input{border:0;background:none;text-align:center;padding:0;font-weight:600;font-size:17px;min-width:0;width:100%;border-radius:0;font-variant-numeric:tabular-nums}
.chk{width:36px;height:36px;border-radius:99px;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;justify-self:center}
.chk svg.i{width:18px;height:18px;stroke-width:3}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--glow)}
.set.done .stp{border-color:rgba(59,130,246,.35)}
.set.hit .idx{color:var(--lime)}
.setlinks{display:flex;justify-content:space-between;margin-top:6px}
.addset{font-size:15px;font-weight:500;padding:8px 0;display:flex;align-items:center;gap:6px;color:var(--txt)}
.addset.rm{color:var(--red)}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.feel button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:var(--card2);font-size:12px;font-weight:600;border:1.5px solid transparent}
.feel button svg{width:26px;height:26px}
.feel .easy{color:var(--lime)} .feel .ok{color:var(--acc)} .feel .hard{color:var(--org)} .feel .pain{color:var(--red)}
.feel button.on{border-color:currentColor;background:var(--card)}
.ssdiv{display:flex;align-items:center;gap:10px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px;margin:-4px 4px 12px}
.ssdiv:before,.ssdiv:after{content:"";flex:1;height:1px;background:var(--line)}
.card.ss-top{margin-bottom:8px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;width:calc(100% - 32px);max-width:528px;background:var(--card);border-radius:18px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:1px solid var(--line)}
.timer .lbl{font-size:20px;font-weight:600}
.timer .t{font-size:20px;font-weight:600;flex:1;font-variant-numeric:tabular-nums}
.timer .p30{background:var(--acc);color:#fff;border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px}
.timer .x{width:40px;height:40px;border-radius:99px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.timer.over .t{color:var(--org)}
/* modales */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.full{max-height:100vh;height:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top))}
.hero{font-weight:700;font-size:26px;letter-spacing:-.4px;line-height:1.15;margin-bottom:6px}
.done-hero{text-align:center;margin-bottom:22px}
.done-hero .ring{width:96px;height:96px;margin:0 auto 18px;border-radius:99px;border:4px solid var(--acc);display:flex;align-items:center;justify-content:center;color:var(--acc);box-shadow:0 0 40px rgba(59,130,246,.45)}
.done-hero .ring svg.i{width:52px;height:52px;stroke-width:3}
.done-hero .t{font-size:28px;font-weight:700}
.done-hero .m{color:var(--mut);margin-top:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:var(--acc);color:#fff;font-weight:600;padding:12px 18px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .35s ease;text-align:center;max-width:92vw}
@keyframes pop{0%{transform:translate(-50%,-20px) scale(.9);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat .ico{font-size:22px;height:28px}
.stat .l{font-size:13px;color:var(--mut);margin-top:6px}
.stat .v{font-weight:700;font-size:24px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--mut);margin-top:2px}
.pr-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr-row:first-child{border-top:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:8px 0 22px}
.bars div{flex:1;background:var(--card2);border-radius:6px 6px 3px 3px;position:relative}
.bars div.ok,.bars div.has{background:var(--acc)}
.bars div.has:not(.ok){opacity:.55}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.best{display:flex;align-items:center;gap:14px}
.best .tro{font-size:34px}
.best .v{font-size:26px;font-weight:700}
.up{color:var(--lime);font-size:14px;font-weight:600}
/* réglages */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);gap:10px}
.set-row:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:32px;height:32px;border-radius:99px;background:var(--card2);font-size:18px;display:flex;align-items:center;justify-content:center}
.stepper .v{min-width:40px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.prow:first-child{border-top:0}
.prow .grow{flex:1}
.prow .tile{width:40px;height:40px;border-radius:11px}
.ed-ex{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ed-row{display:grid;grid-template-columns:repeat(4,1fr) 40px;gap:6px;align-items:end}
.ed-row label{font-size:10px;color:var(--mut);display:block;margin-bottom:2px}
.ed-row input,.ed-row select{padding:8px 6px;font-size:15px}
.x{color:var(--red);font-size:18px;height:38px}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.fl{font-size:13px;color:var(--mut);margin:12px 0 5px;display:block}
.daybar{display:flex;gap:8px;align-items:center}
.daybar input{font-weight:700}
.chkrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.chkrow input{width:22px;height:22px;flex:none}
.next-title{font-weight:700;font-size:28px;margin:2px 0 6px}
.center{text-align:center}
.startbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:9;padding:10px 16px;display:flex;justify-content:center;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.startbar .btn{max-width:528px}
body.has-start #app{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.mini-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px}
.mini-card .grow{flex:1;min-width:0}
.mini-card .exname{font-size:16px}
.mini-card.fin{opacity:.75}
.done-ic{width:30px;height:30px;background:var(--lime);border-color:var(--lime);color:#fff}
.done-ic svg.i{width:16px;height:16px}
[id^="ex-"]{scroll-margin-top:178px}
.set.wu .idx{color:var(--org);font-size:13px}
.set.wu .stp{opacity:.8}
.setup{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:12px;background:var(--card2);font-size:14px;font-weight:500;width:100%;text-align:left}
.setup svg.i{width:16px;height:16px;color:var(--mut)}
.setup.empty{color:var(--mut)}
.plates{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin-top:6px}
.plates b{color:var(--txt)}
.setlinks{gap:6px}
.addset svg.g{width:16px;height:16px;color:var(--org)}
.card.due{box-shadow:inset 0 0 0 1.5px var(--acc)}
.wt-top{display:flex;justify-content:space-between;align-items:flex-start}
.wt-big{font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.wt-big .of{font-size:18px;color:var(--mut);font-weight:600}
.wt-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-h span{font-size:12px;color:var(--mut);font-weight:600}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums}
.cal span.on{background:var(--acc);color:#fff;font-weight:700}
.cal span.today{outline:2px solid var(--acc);outline-offset:-2px}
.editbtn[disabled]{pointer-events:none}
.tile img.mimg{width:100%;height:100%;object-fit:cover;display:block}
.body-fig .dimg{height:118px;width:auto;display:block}
.body-fig{filter:none}
.prow .tile img.dimg{width:100%;height:100%;object-fit:contain}
svg.g{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
svg.g.flame{color:var(--org);width:20px;height:20px} svg.g.gold,.ico.gold{color:#E6A700} svg.g.blue,.ico.blue{color:var(--acc)}
.ico svg.g{width:24px;height:24px}
.tro svg.g{width:34px;height:34px;color:#E6A700}
.up svg.g{width:14px;height:14px;margin-right:2px}
.tg-mini{display:flex;align-items:center;gap:6px}
.tg-mini.goal{color:var(--acc)} .tg-mini.load{color:var(--org)} .tg-mini.hold{color:var(--red)}
.target{display:flex;align-items:flex-start;gap:10px;font-weight:500}
.target svg.g{width:20px;height:20px;margin-top:1px;color:var(--acc)}
.target.load svg.g{color:var(--org)} .target.hold svg.g{color:var(--red)} .target.first svg.g,.target.routine svg.g{color:var(--mut)}
.target b{font-weight:700}
.mini-h svg.g{width:18px;height:18px}

inc": 2.5, "max": 10, "min": 6, "name": "Hack squat", "sets": 3, "unit": "reps"}, {"id": "fentes", "inc": 2, "max": 12, "min": 8, "name": "Fentes", "sets": 3, "unit": "reps"}, {"id": "leg_ext", "inc": 2.5, "max": 12, "min": 8, "name": "Leg extension", "sets": 3, "unit": "reps"}, {"id": "mollets", "inc": 2.5, "max": 15, "min": 10, "name": "Mollets", "sets": 3, "unit": "reps"}]}]}, "sessions": [{"date": 1794620259500, "dayId": "PUSH", "dayName": "Push", "durationMin": 9, "entries": [{"exId": "smith_incl", "feel": null, "goal": false, "name": "Smith développé incliné", "sets": [{"r": 8, "w": 40}, {"r": 7, "w": 40}, {"r": 6, "w": 40}], "unit": "reps"}, {"exId": "dev_militaire", "feel": null, "goal": false, "name": "Développé militaire", "sets": [{"r": 8, "w": 20}, {"r": 7, "w": 20}, {"r": 6, "w": 20}], "unit": "reps"}, {"exId": "elev_lat", "feel": null, "goal": false, "name": "Élévations latérales poulie", "sets": [{"r": 10, "w": 9}, {"r": 9, "w": 9}, {"r": 8, "w": 9}], "unit": "reps"}], "goalsHit": 0, "goalsTotal": 7, "id": "mwfqkejweotq0", "prs": [], "sets": 9, "volume": 1503}, {"date": 1789652520000, "dayId": "BASE", "dayName": "Repères (tes notes)", "durationMin": 0, "entries": [{"exId": "smith_incl", "feel": null, "name": "Smith développé incliné", "sets": [{"r": 10, "w": 40}], "unit": "reps"}, {"exId": "dev_incl", "feel": null, "name": "Développé incliné", "sets": [{"r": 10, "w": 30}], "unit": "reps"}, {"exId": "dev_militaire", "feel": null, "name": "Développé militaire", "sets": [{"r": 7, "w": 24}], "unit": "reps"}, {"exId": "elev_lat", "feel": null, "name": "Élévations latérales", "sets": [{"r": 6, "w": 12}], "unit": "reps"}, {"exId": "pec_fly", "feel": null, "name": "Pec fly", "sets": [{"r": 8, "w": 93}], "unit": "reps"}, {"exId": "pec_uni", "feel": null, "name": "Pec unilatéral", "sets": [{"r": 7, "w": 25}], "unit": "reps"}, {"exId": "tri_poulie", "feel": null, "name": "Triceps poulie haute / basse", "sets": [{"r": 10, "w": 27}], "unit": "reps"}, {"exId": "tri_uni", "feel": null, "name": "Triceps unilatéral", "sets": [{"r": 6, "w": 3}], "unit": "reps"}, {"exId": "tirage_vert", "feel": null, "name": "Tirage vertical / traction", "sets": [{"r": 8, "w": 66}], "unit": "reps"}, {"exId": "curl_ez", "feel": null, "name": "Curl EZ", "sets": [{"r": 9, "w": 25}], "unit": "reps"}, {"exId": "tirage_horiz", "feel": null, "name": "Tirage horizontal", "sets": [{"r": 7, "w": 52}], "unit": "reps"}, {"exId": "poulie_ailes", "feel": null, "name": "Poulie haute (ailes)", "sets": [{"r": 10, "w": 11}], "unit": "reps"}, {"exId": "curl_marteau", "feel": null, "name": "Curl marteau", "sets": [{"r": 6, "w": 16}], "unit": "reps"}, {"exId": "arriere_epaule", "feel": null, "name": "Tirage arrière d'épaule", "sets": [{"r": 11, "w": 11}], "unit": "reps"}, {"exId": "curl_incl", "feel": null, "name": "Curl banc incliné", "sets": [{"r": 8, "w": 12}], "unit": "reps"}, {"exId": "hack_squat", "feel": null, "name": "Hack squat", "sets": [{"r": 8, "w": 25}], "unit": "reps"}, {"exId": "fentes", "feel": null, "name": "Fentes", "sets": [{"r": 8, "w": 14}], "unit": "reps"}, {"exId": "leg_ext", "feel": null, "name": "Leg extension", "sets": [{"r": 8, "w": 52}], "unit": "reps"}, {"exId": "mollets", "feel": null, "name": "Mollets", "sets": [{"r": 13, "w": 93}], "unit": "reps"}], "goalsHit": 0, "goalsTotal": 0, "id": "reperes-sept", "prs": [], "sets": 19, "volume": 0}]};

const S = { config:null, sessions:[], draft:null, view:"home", progEx:null, sync:"connecting",

/* ================= STOCKAGE CLOUD ================= */
let db = null;
const writers = {};
function writeDoc(path, data){            // une écriture à la fois par document, la plus récente gagne
  if(!db) return;
  const w = writers[path] || (writers[path] = {busy:false, next:undefined});
  w.next = data;
  if(w.busy) return;
  (async () => {
    w.busy = true;
    while(w.next !== undefined){
      const d = w.next; w.next = undefined;
      try{ if(d === null) await db.doc(path).delete(); else await db.doc(path).set(d); }
      catch(e){ if(e && e.code === "quota_exceeded") showToast("Stockage plein : exporte puis supprime de vieilles séances", true); }
    }
    w.busy = false;
  })();
}
function saveConfig(){ saveLocal(); writeDoc("app/config", clone(S.config)); }
function saveDraft(){ saveLocal(); writeDoc("app/draft", S.draft ? {draft: clone(S.draft)} : null); }

async function initDb(){
  const timeout = setTimeout(() => { if(S.sync === "connecting"){ S.sync = "slow"; render(); } }, 10000);
  if(!(window.claude && window.claude.use)){ clearTimeout(timeout); S.sync = "local"; render(); return; }
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db){ clearTimeout(timeout); S.sync = "local"; render(); return; }
  let cfgOk = false, sesOk = false;
  const done = () => { if(cfgOk && sesOk){ clearTimeout(timeout); S.sync = "cloud"; } };
  db.doc("app/config").onSnapshot(snap => {
    if(snap.exists){ S.config = normConfig(clone(snap.data())); }
    if(!snap.metadata.fromCache){ cfgOk = true; done(); }
    saveLocal(); render();
  }, () => { S.sync = "local"; render(); });
  db.collection("sessions").onSnapshot(snap => {
    const remote = snap.docs.map(d => clone(d.data())).filter(s => s && s.id);
    if(!snap.metadata.fromCache){
      sesOk = true; done();
      // migration : séances locales jamais envoyées
      const ids = new Set(remote.map(s => s.id));
      S.sessions.filter(s => !ids.has(s.id)).forEach(s => { writeDoc("sessions/" + s.id, s); remote.push(s); });
    }
    S.sessions = remote.sort((a,b) => b.date - a.date);
    saveLocal(); render();
  }, () => { S.sync = "local"; render(); });
  try{
    const ds = await db.doc("app/draft").get();
    if(ds.exists && !S.draft && ds.data().draft){ S.draft = clone(ds.data().draft); saveLocal(); render(); }
  }catch(e){}
}

/* ================= LOGIQUE DE PROGRESSION ================= */
function history(exId){            // entrées passées, de la plus récente à la plus ancienne
  const out = [];
  for(const s of S.sessions){ const e = (s.entries||[]).find(x => x.exId === exId); if(e && e.sets && e.sets.length) out.push({...e, date:s.date}); }
  return out;
}
function entryBest(e){ return Math.max(0, ...e.sets.map(s => e.unit === "sec" ? s.r : (e1rm(s.w, s.r) || s.r))); }
function entryMaxW(e){ return Math.max(0, ...e.sets.map(s => s.w || 0)); }

function computeTarget(ex, last){
  if(ex.unit === "routine") return {type:"routine", sets:null};
  if(!last) return {type:"first", sets:null};
  const ls = last.sets.slice();
  while(ls.length < ex.sets) ls.push({...ls[ls.length-1]});
  const base = ls.slice(0, ex.sets).map(s => ({w:s.w, r:s.r}));
  if(last.feel === "pain") return {type:"hold", sets:base};
  const topW = Math.max(...base.map(s => s.w));
  const allTop = last.sets.length >= ex.sets && base.every(s => s.r >= ex.max && s.w >= topW);
  if(allTop){
    if(ex.unit === "sec") return {type:"reps", sets: base.map(s => ({w:s.w, r:s.r + 5}))};
    if(ex.inc > 0) return {type:"load", sets: base.map(() => ({w: topW + ex.inc, r: ex.min}))};
    return {type:"reps", sets: base.map(s => ({w:s.w, r:s.r + 1}))};
  }
  const t = base.map(s => ({w:s.w, r:s.r}));
  let idx = -1, low = Infinity;
  t.forEach((s,i) => { if(s.r < ex.max && s.r < low){ low = s.r; idx = i; } });
  if(idx >= 0) t[idx].r += ex.unit === "sec" ? 5 : 1;
  return {type:"reps", sets:t};
}
function targetText(ex, tg){
  const u = ex.unit === "sec" ? "s" : "";
  if(tg.type === "routine") return `${G("timer")}<span>${ex.min} minutes, coche quand c'est fait</span>`;
  if(tg.type === "deload") return `${G("clock")}<span>Décharge : mêmes charges, 2 à 3 reps en réserve</span>`;
  if(tg.type === "first") return `${G("plusc")}<span>Première fois : trouve une charge où tu finis à 2–3 reps de l'échec</span>`;
  const reps = tg.sets.map(s => s.r + u).join(" / ");
  const w = tg.sets[0].w;
  if(tg.type === "load") return `${G("flame")}<span>Tu montes à <b>${fmt(w)} kg</b>, vise ${ex.min} reps ou plus</span>`;
  if(tg.type === "hold") return `${G("alert")}<span>Douleur la dernière fois : même charge (${w ? fmt(w)+" kg" : "poids du corps"}), technique d'abord</span>`;
  return `${G("target")}<span>Objectif <b>${w ? fmt(w)+" kg × " : ""}${reps}</b></span>`;
}
function stagnation(exId){
  const h = history(exId); if(h.length < 4 || h[0].unit === "routine") return false;
  const bests = h.map(entryBest);          // [récent ... ancien]
  const recent = Math.max(...bests.slice(0,3)); const before = Math.max(...bests.slice(3));
  return recent <= before;
}
function allExercises(){
  const m = new Map();
  S.config.program.forEach(d => d.ex.forEach(e => {
    if(hasVar(e)) e.variants.forEach((v,i) => { const k = exKey(e,i); if(!m.has(k)) m.set(k, {id:k, name:exLabel(e,i), unit:e.unit}); });
    else if(!m.has(e.id)) m.set(e.id, e);
  }));
  S.sessions.forEach(s => (s.entries||[]).forEach(e => { if(!m.has(e.exId)) m.set(e.exId, {id:e.exId, name:e.name, unit:e.unit}); }));
  return [...m.values()];
}
function weekCount(ws){ return S.sessions.filter(s => weekStart(s.date) === ws).length; }
function streakInfo(){
  const goal = S.config.weeklyGoal; let ws = weekStart(Date.now());
  const cur = weekCount(ws); let streak = cur >= goal ? 1 : 0;
  let p = prevWeek(ws);
  while(weekCount(p) >= goal){ streak++; p = prevWeek(p); }
  return {cur, streak, goal};
}

/* ================= VARIANTES & SUPERSETS ================= */
const hasVar = ex => !!(ex.variants && ex.variants.length);
function exKey(ex, vi){ return hasVar(ex) ? ex.id + "~" + ex.variants[Math.min(vi||0, ex.variants.length-1)].id : ex.id; }
function exLabel(ex, vi){ return hasVar(ex) ? ex.name + " · " + ex.variants[Math.min(vi||0, ex.variants.length-1)].name : ex.name; }
function lastVariant(ex){
  if(!hasVar(ex)) return 0;
  for(const s of S.sessions) for(const e of (s.entries||[])){ const i = ex.variants.findIndex(v => ex.id + "~" + v.id === e.exId); if(i >= 0) return i; }
  return 0;
}
function programKeys(){ const k = new Set(); S.config.program.forEach(d => d.ex.forEach(ex => { if(hasVar(ex)) ex.variants.forEach((v,i) => k.add(exKey(ex,i))); else k.add(ex.id); })); return k; }
function makeEntry(ex, vi){
  const id = exKey(ex, vi), last = history(id)[0], tg = computeTarget(ex, last);
  const startW = (hasVar(ex) ? ex.variants[Math.min(vi||0, ex.variants.length-1)].startW : ex.startW) || 0;
  const sets = [];
  let n = ex.unit === "routine" ? 1 : ex.sets;
  let target = tg;
  if(inDeload() && ex.unit !== "routine"){
    n = Math.max(1, n - 1);
    const ls = last ? last.sets : [];
    for(let i=0;i<n;i++){ const l = ls[i] || ls[ls.length-1]; sets.push({ w: l ? l.w : startW, r: ex.min, done:false }); }
    target = {type:"deload", sets:null};
  } else {
    for(let i=0;i<n;i++){ const t = tg.sets ? tg.sets[i] : null; sets.push({ w: t ? t.w : startW, r: t ? t.r : ex.min, done:false }); }
  }
  return { exId:id, baseId:ex.id, vi:vi||0, variants: hasVar(ex) ? clone(ex.variants) : null, name: exLabel(ex, vi), baseName: ex.name,
    unit:ex.unit, min:ex.min, max:ex.max, inc:ex.inc, note:ex.note||"", setup:ex.setup||"", rest: restFor(ex), nSets:n, ss: !!ex.ss, target, sets, feel:null };
}
function restFor(ex){ return ex.rest || (ex.unit === "routine" ? 0 : ex.min <= 6 ? 150 : S.config.restSec); }
function inDeload(){ return S.config.deloadUntil && Date.now() < S.config.deloadUntil; }
function entryDone(e){ return e.sets.length > 0 && e.sets.every(s => s.done); }
function focusIdx(d){
  if(Number.isInteger(d.focus) && d.entries[d.focus] && !entryDone(d.entries[d.focus])) return d.focus;
  return d.entries.findIndex(e => !entryDone(e));
}
function isOpen(d, ei){
  if(S.openEx.has(ei)) return true;
  const f = focusIdx(d); if(f < 0) return false;
  if(ei === f) return true;
  if(d.entries[f].ss && ei === f + 1) return true;
  if(ei === f - 1 && d.entries[ei].ss) return true;
  return false;
}
function workSets(e){ return e.sets.filter(s => !s.wu); }
function stepOf(e){ return e.inc >= 2.5 || e.inc === 0 ? 2.5 : e.inc >= 2 ? 2 : 1; }
function platesTxt(total){
  let x = Math.round(total/2*100)/100; if(x <= 0) return "";
  const out = []; for(const p of [25,20,15,10,5,2.5,1.25]) while(x >= p - 1e-9){ out.push(fmt(p)); x = Math.round((x-p)*100)/100; }
  return out.length ? out.join(" + ") + (x > 0 ? " (+" + fmt(x) + ")" : "") : "";
}
function usesPlates(e){ return (e.variants && /disque/i.test(e.variants[e.vi] ? e.variants[e.vi].name : "")) || /disques?/i.test(e.setup||""); }
function parseVariants(str, old){
  const names = String(str||"").split(",").map(s => s.trim()).filter(Boolean);
  if(names.length < 2) return null;
  return names.map(n => { const o = (old||[]).find(v => v.name.toLowerCase() === n.toLowerCase()); return o ? {id:o.id, name:n} : {id:"v" + uid().slice(-6), name:n}; });
}

/* ================= SÉANCE ================= */
function startWorkout(dayIdx){
  const day = S.config.program[dayIdx];
  S.draft = { dayIdx, dayId:day.id, dayName:day.name, start:Date.now(),
    entries: day.ex.map(ex => makeEntry(ex, lastVariant(ex)))
  };
  S.view = "workout"; S.pickIdx = null; saveDraft(); render(); window.scrollTo(0,0);
}
function checkSet(ei, si){
  const e = S.draft.entries[ei], s = e.sets[si];
  s.done = !s.done;
  ensureAudio();
  const d = S.draft, before = focusIdx(d);
  let toasted = false;
  if(s.done && s.wu){ startTimer(60); }
  else if(s.done){
    try{ navigator.vibrate && navigator.vibrate(12); }catch(err){}
    // record ?
    const h = history(e.exId);
    if(h.length && e.unit !== "routine"){
      const prevBest = Math.max(...h.map(entryBest));
      const prevMaxW = Math.max(...h.map(entryMaxW));
      const others = e.sets.filter((x,i) => x.done && i !== si && !x.wu);
      const curBestOthers = Math.max(0, ...others.map(x => e.unit === "sec" ? x.r : (e1rm(x.w,x.r) || x.r)));
      const val = e.unit === "sec" ? s.r : (e1rm(s.w, s.r) || s.r);
      if(s.w > prevMaxW && s.w > Math.max(0, ...others.map(x => x.w))) toasted = true, showToast(`Record de charge : ${fmt(s.w)} kg`, false, "pr");
      else if(val > prevBest && val > curBestOthers) toasted = true, showToast(e.unit === "sec" ? `Record : ${s.r} s` : `Record : 1RM estimé ${fmt(Math.round(val*2)/2)} kg`, false, "pr");
      else if(e.target.sets && e.target.sets[si - e.sets.filter(x => x.wu).length] && s.w >= e.target.sets[si - e.sets.filter(x => x.wu).length].w && s.r >= e.target.sets[si - e.sets.filter(x => x.wu).length].r) toasted = true, showToast("Objectif de la série atteint", false, "ok");
    }
    const nxt = S.draft.entries[ei+1];
    if(e.ss && nxt){ stopTimer(); if(!toasted) showToast("Enchaîne direct : " + (nxt.baseName || nxt.name), false, "link"); }
    else if(e.unit === "routine"){ stopTimer(); showToast("Routine abdos validée", false, "ok"); }
    else startTimer(e.rest);
  }
  if(s.done){
    const nxt = d.entries[ei+1], prv = d.entries[ei-1], cnt = x => x.sets.filter(y => y.done).length;
    let f;
    if(e.ss && nxt && !entryDone(nxt) && cnt(nxt) < cnt(e)) f = ei + 1;
    else if(prv && prv.ss && !entryDone(prv)) f = ei - 1;
    else if(!entryDone(e)) f = ei;
    else { f = d.entries.findIndex((x,i) => i > ei && !entryDone(x)); if(f < 0) f = d.entries.findIndex(x => !entryDone(x)); }
    d.focus = f;
    if(entryDone(e)) S.openEx.delete(ei);
    S.scrollTo = (f !== before && f >= 0) ? f : null;
  }
  saveDraft(); render();
  if(S.scrollTo != null){ const id = "ex-" + S.scrollTo; S.scrollTo = null; setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 60); }

function entryGoalHit(e){
  if(!e.target || !e.target.sets) return null;
  const done = e.sets.filter(s => s.done && !s.wu);
  if(done.length < e.target.sets.length) return false;
  return e.target.sets.every((t,i) => done[i].w >= t.w && done[i].r >= t.r);
}
function finishWorkout(){
  const d = S.draft;
  const entries = d.entries.map(e => ({ exId:e.exId, name:e.name, unit:e.unit, feel:e.feel,
    sets: e.sets.filter(s => s.done && !s.wu).map(s => ({w:+s.w||0, r:+s.r||0})), goal: entryGoalHit(e) }))
    .filter(e => e.sets.length);
  if(!entries.length){ S.confirm = "abandon"; render(); return; }
  const prs = [];
  entries.forEach(e => {
    const h = history(e.exId); if(!h.length) return;
    const b = entryBest(e), pb = Math.max(...h.map(entryBest));
    const w = entryMaxW(e), pw = Math.max(...h.map(entryMaxW));
    if(w > pw) prs.push({name:e.name, txt:`${fmt(w)} kg (avant ${fmt(pw)})`});
    else if(b > pb) prs.push({name:e.name, txt: e.unit === "sec" ? `${b} s` : `1RM est. ${fmt(Math.round(b*2)/2)} kg (+${fmt(Math.round((b-pb)*2)/2)})`});
  });
  const volume = entries.reduce((a,e) => a + e.sets.reduce((x,s) => x + (e.unit === "sec" ? 0 : s.w*s.r), 0), 0);
  const goals = d.entries.map(entryGoalHit).filter(g => g !== null);
  const prevSame = S.sessions.find(s => s.dayId === d.dayId);
  const session = { id: uid(), date: Date.now(), dayId:d.dayId, dayName:d.dayName, entries, prs,
    volume: Math.round(volume), goalsHit: goals.filter(Boolean).length, goalsTotal: goals.length,
    sets: entries.reduce((a,e) => a + e.sets.length, 0), durationMin: Math.round((Date.now()-d.start)/60000) };
  S.sessions = [session, ...S.sessions];
  writeDoc("sessions/" + session.id, session);
  S.config.nextIdx = (d.dayIdx + 1) % S.config.program.length;
  saveConfig();
  S.draft = null; saveDraft(); stopTimer(); S.openEx = new Set();
  S.view = "home";
  S.modal = {type:"summary", session, prevVol: prevSame ? prevSame.volume : null};
  render(); window.scrollTo(0,0);
}

const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const keyTs = k => { const [y,m,dd] = k.split("-").map(Number); return new Date(y, m-1, dd, 12).getTime(); };
const monthOf = k => k.slice(0,7);
function monthAvg(mk){ const xs = S.weights.filter(x => monthOf(x.d) === mk).map(x => x.w); return xs.length ? {avg: xs.reduce((p,q) => p+q, 0)/xs.length, n: xs.length} : null; }
function prevMonthKey(mk){ let [y,m] = mk.split("-").map(Number); m--; if(m === 0){ m = 12; y--; } return y + "-" + String(m).padStart(2,"0"); }
function weighDue(){ const today = dayKey(Date.now()); return !monthAvg(monthOf(today)) && new Date(Date.now()).getDate() <= 10; }
function weighBlock(compact){
  const today = dayKey(Date.now()), tw = S.weights.find(x => x.d === today);
  const lastW = S.weights.length ? S.weights[S.weights.length-1].w : 74;
  if(S.wDraft == null) S.wDraft = tw ? tw.w : lastW;
  return `<div class="wt-row"><div class="stepper"><button data-a="wstep" data-v="-0.1">−</button><span class="v num" style="min-width:64px">${fmt(Math.round(S.wDraft*10)/10)} kg</span><button data-a="wstep" data-v="0.1">+</button></div>
      <button class="btn ${tw ? "ghost" : "main"} sm" style="width:auto;padding:0 18px" data-a="wsave">${tw ? "Pesé " + IC.check : "Enregistrer"}</button></div>`;
}
function weightCard(){
  const mk = monthOf(dayKey(Date.now())), cur = monthAvg(mk), prev = monthAvg(prevMonthKey(mk));
  const last = S.weights[S.weights.length-1];
  const months = []; let m = mk; for(let i=0;i<8;i++){ const a = monthAvg(m); if(a) months.unshift(a.avg); m = prevMonthKey(m); }
  const due = weighDue();
  let msg;
  if(cur && prev){
    const dlt = cur.avg - prev.avg;
    msg = `<b>${dlt >= 0 ? "+" : ""}${fmt(Math.round(dlt*10)/10)} kg</b> depuis le mois dernier. ` + (dlt < 0.8 ? "Un peu lent : ajoute 150 à 200 kcal par jour." : dlt > 2 ? "Un peu rapide : retire 150 kcal par jour pour limiter le gras." : "Rythme parfait pour une prise de masse propre (1 à 1,6 kg par mois).");
  } else if(cur) msg = "Pesée du mois enregistrée. La comparaison arrive avec ta pesée du mois prochain.";
  else msg = due ? "C'est le début du mois : pèse-toi à la salle avant ta séance, toujours dans les mêmes conditions." : `Prochaine pesée : début ${new Date(new Date(Date.now()).getFullYear(), new Date(Date.now()).getMonth()+1, 1).toLocaleDateString("fr-BE",{month:"long"})}.`;
  return `<div class="card ${due ? "due" : ""}"><div class="wt-top"><div><div class="wk-lbl">Poids${due ? ' <span class="badge">Pesée du mois</span>' : ""}</div>
      <div class="wt-big num">${last ? fmt(last.w) : "—"} <span class="of">kg</span></div><div class="mut small">${last ? "pesé le " + new Date(keyTs(last.d)).toLocaleDateString("fr-BE",{day:"numeric", month:"long"}) : "aucune pesée pour l'instant"}</div></div>
      ${months.length > 1 ? sparkline(months) : ""}</div>
    ${due || cur && S.weights.some(x => x.d === dayKey(Date.now())) ? weighBlock() : ""}
    <div class="small" style="margin-top:12px">${msg}</div>
    ${!due && !S.weights.some(x => x.d === dayKey(Date.now())) ? `<button class="addset" data-a="wopen" style="margin-top:4px;color:var(--acc)">${IC.plus} Ajouter une pesée</button>` : ""}
    ${S.wOpen && !due ? weighBlock() : ""}</div>`;
}
function sparkline(vals){
  const W = 110, H = 40, mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v,i) => `${(i*(W-6)/(vals.length-1)+3).toFixed(1)},${(H-4-(v-mn)/rg*(H-8)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function consecWeeks(){
  let n = 0, ws = weekStart(Date.now()); const since = S.config.lastDeload || 0;
  if(S.sessions.filter(s => s.dayId !== "BASE" && weekStart(s.date) === ws).length < 2) ws = prevWeek(ws);
  while(ws > since && S.sessions.filter(s => s.dayId !== "BASE" && weekStart(s.date) === ws).length >= 2){ n++; ws = prevWeek(ws); }
  return n;
}
function calendar(){
  const now = new Date(); const m = new Date(now.getFullYear(), now.getMonth() + S.calOff, 1);
  const days = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate(), lead = (m.getDay()+6)%7;
  const done = new Set(S.sessions.filter(s => s.dayId !== "BASE").map(s => dayKey(s.date)));
  const tk = dayKey(Date.now());
  let cells = ""; for(let i=0;i<lead;i++) cells += `<span></span>`;
  for(let dd=1; dd<=days; dd++){ const k = dayKey(new Date(m.getFullYear(), m.getMonth(), dd)); cells += `<span class="${done.has(k) ? "on" : ""} ${k === tk ? "today" : ""}">${dd}</span>`; }
  const cnt = [...done].filter(k => k.startsWith(m.getFullYear() + "-" + String(m.getMonth()+1).padStart(2,"0"))).length;
  return `<div class="card"><div class="row" style="margin-bottom:10px"><button class="editbtn" data-a="cal" data-v="-1">${IC.back}</button>
    <div class="center"><div style="font-weight:600;text-transform:capitalize">${m.toLocaleDateString("fr-BE",{month:"long", year:"numeric"})}</div><div class="mut small">${cnt} séance${cnt>1?"s":""}</div></div>
    <button class="editbtn" data-a="cal" data-v="1" ${S.calOff >= 0 ? "disabled style='opacity:.3'" : ""}>${IC.chev}</button></div>
    <div class="cal-h">${["L","M","M","J","V","S","D"].map(x => `<span>${x}</span>`).join("")}</div><div class="cal">${cells}</div></div>`;
}

function renderWorkout(){
  const d = S.draft;
  const total = d.entries.reduce((a,e) => a + e.sets.length, 0);
  const done = d.entries.reduce((a,e) => a + e.sets.filter(s => s.done).length, 0);
  let h = `<div class="wk-head"><div class="wk-nav"><button data-a="nav" data-v="home" aria-label="Retour">${IC.back}</button><div class="ttl">${esc(d.dayName)}</div>
      <button class="btn-end" data-a="finish">Terminer</button></div>
    <div class="wk-clock"><span class="t" id="clock">${hms((Date.now()-d.start)/1000)}</span><span class="s">${done} / ${total} séries</span></div>
    <div class="prog"><i style="width:${total ? done/total*100 : 0}%"></i></div></div>`;
  if(weighDue()) h += `<div class="card due"><div class="mini-h">${G("clock","blue")}Pesée du mois</div><div class="small mut">Tu es à la salle : pèse-toi avant de commencer, ça prend 10 secondes.</div>${weighBlock()}</div>`;
  d.entries.forEach((e, ei) => {
    const last = history(e.exId)[0];
    const u = e.unit === "sec" ? "s" : e.unit === "routine" ? " min" : "";
    const stag = stagnation(e.exId);
    const prevE = d.entries[ei-1], nextE = d.entries[ei+1];
    const open = isOpen(d, ei);
    if(prevE && prevE.ss && open) h += `<div class="ssdiv">${G("link")}Superset, enchaîne sans repos</div>`;
    if(!open){
      const ws = workSets(e).filter(s => s.done), fin = entryDone(e);
      h += `<button class="card mini-card ${fin ? "fin" : ""}" id="ex-${ei}" data-a="openex" data-e="${ei}"><div class="tile sm">${tileFig(e.baseName || e.name, 38)}</div>
        <div class="grow"><div class="exname">${esc(e.baseName || e.name)}</div>
        <div class="exsub">${fin ? ws.map(s => (s.w ? fmt(s.w) + " × " : "") + s.r + u).join(", ") : ws.length ? ws.length + " / " + workSets(e).length + " séries faites" : e.unit === "routine" ? e.min + " min" : `${e.nSets} séries de ${e.min} à ${e.max} ${e.unit==="sec"?"s":"reps"}`}</div></div>
        ${fin ? `<span class="chk done-ic">${IC.check}</span>` : IC.chev}</button>`;
      return;
    }
    const wuN = e.sets.filter(s => s.wu).length;
    const firstW = (workSets(e)[0] || {}).w || 0;
    h += `<div class="card${e.ss && nextE ? " ss-top" : ""}" id="ex-${ei}"><div class="exhead"><div class="tile sm">${tileFig(e.baseName || e.name, 38)}</div>
      <div class="grow"><div class="exname">${esc(e.baseName || e.name)}</div><div class="exsub">${e.unit === "routine" ? e.min + " min" : `${e.nSets} séries de ${e.min} à ${e.max} ${e.unit==="sec"?"s":"reps"}${e.rest ? ", repos " + mmss(e.rest) : ""}`}${stag ? `, <span style="color:var(--org)">stagne</span>` : ""}</div></div>
      <button class="editbtn" data-a="swap" data-e="${ei}" aria-label="Remplacer">${IC.swap}</button>
      <button class="editbtn" data-a="exedit" data-e="${ei}" aria-label="Modifier">${IC.pen}</button></div>
      ${e.variants ? `<div class="seg">${e.variants.map((v,i) => `<button class="${i===e.vi?"on":""}" data-a="variant" data-e="${ei}" data-v="${i}">${esc(v.name)}</button>`).join("")}</div>` : ""}
      <button class="setup ${e.setup ? "" : "empty"}" data-a="setup" data-e="${ei}">${IC.gear}<span>${e.setup ? esc(e.setup) : "Noter mon réglage (siège, prise…)"}</span></button>
      ${e.note ? `<div class="ex-note">${esc(e.note)}</div>` : ""}
      ${last ? `<div class="last">Dernière fois : ${last.sets.map(s => (s.w ? fmt(s.w)+" × " : "") + s.r + u).join(" / ")} <span class="mut small">(${dateFr(last.date)})</span></div>` : ""}
      <div class="target ${e.target.type}">${targetText(e, e.target)}</div>
      ${e.unit === "routine" ? `<div class="sets">${e.sets.map((s, si) => `<div class="set ${s.done?"done":""}" style="grid-template-columns:22px 1fr 40px"><div class="idx">${G("timer")}</div>
          <div class="stp"><button data-a="st" data-e="${ei}" data-s="${si}" data-f="r" data-d="-1">−</button><input inputmode="numeric" data-in="r" data-e="${ei}" data-s="${si}" value="${s.r}"><span class="mut small" style="margin-right:6px">min</span><button data-a="st" data-e="${ei}" data-s="${si}" data-f="r" data-d="1">+</button></div>
          <button class="chk" data-a="chk" data-e="${ei}" data-s="${si}">${IC.check}</button></div>`).join("")}</div>` : `<div class="sets">${e.sets.map((s, si) => {
        const t = !s.wu && e.target.sets && e.target.sets[si - wuN];
        const hit = s.done && t && s.w >= t.w && s.r >= t.r;
        return `<div class="set ${s.done?"done":""} ${hit?"hit":""} ${s.wu?"wu":""}"><div class="idx">${s.wu ? "É" : si+1-wuN}</div>
          <div class="stp"><button data-a="st" data-e="${ei}" data-s="${si}" data-f="w" data-d="-1">−</button><input inputmode="decimal" data-in="w" data-e="${ei}" data-s="${si}" value="${fmt(s.w)}"><span class="mut small">kg</span><button data-a="st" data-e="${ei}" data-s="${si}" data-f="w" data-d="1">+</button></div>
          <div class="stp"><button data-a="st" data-e="${ei}" data-s="${si}" data-f="r" data-d="-1">−</button><input inputmode="numeric" data-in="r" data-e="${ei}" data-s="${si}" value="${s.r}"><button data-a="st" data-e="${ei}" data-s="${si}" data-f="r" data-d="1">+</button></div>
          <button class="chk" data-a="chk" data-e="${ei}" data-s="${si}">${IC.check}</button></div>`; }).join("")}</div>
      ${usesPlates(e) && firstW ? `<div class="plates">${G("dumbbell")}<span>${fmt(firstW)} kg = <b>${platesTxt(firstW)}</b> par côté</span></div>` : ""}
      <div class="setlinks"><button class="addset" data-a="addset" data-e="${ei}">${IC.plus} Série</button>${!wuN && firstW > 0 && e.unit === "reps" && !e.sets.some(s => s.done) ? `<button class="addset" data-a="warmup" data-e="${ei}">${G("flame")} Échauffement</button>` : ""}${workSets(e).length > 1 ? `<button class="addset rm" data-a="delset" data-e="${ei}">${IC.minus} Série</button>` : ""}</div>`}
      <div class="feel">${[["easy","Facile"],["ok","Correct"],["hard","Dur"],["pain","Douleur"]].map(([k,l]) =>
        `<button class="${e.feel===k?"on":""} ${k}" data-a="feel" data-e="${ei}" data-v="${k}">${FACES[k]}${l}</button>`).join("")}</div>
      ${S.openEx.has(ei) && ei !== focusIdx(d) ? `<button class="addset" data-a="openex" data-e="${ei}" style="margin:8px auto 0;color:var(--mut)">Replier</button>` : ""}</div>`;
  });
  h += `<button class="btn ghost sm" data-a="exadd" style="margin-bottom:12px">${IC.plus} Ajouter un exercice</button>
    <button class="btn main" data-a="finish">Terminer la séance</button>
    <button class="btn ghost sm" data-a="askabandon" style="margin-top:12px;color:var(--red)">Abandonner</button>`;
  return h;
}

function lineChart(points, unit){
  if(points.length < 2) return `<div class="mut small" style="padding:20px 0">Le graphique apparaît après 2 séances sur cet exercice.</div>`;
  const W = 340, H = 160, P = 26;
  const ys = points.map(p => p.v), mn = Math.min(...ys), mx = Math.max(...ys), rg = (mx - mn) || 1;
  const X = i => P + i * (W - P - 10) / (points.length - 1);
  const Y = v => H - 20 - (v - mn) / rg * (H - 40);
  const line = points.map((p,i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const grid = [0, .5, 1].map(f => { const v = mn + f*rg, y = Y(v); return `<line x1="${P}" x2="${W-6}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="0" y="${y+4}" style="fill:var(--mut)" font-size="10">${fmt(Math.round(v))}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <polygon points="${X(0)},${H-20} ${line} ${X(points.length-1)},${H-20}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="#3B82F6"/>`).join("")}
    <text x="${P}" y="${H-4}" style="fill:var(--mut)" font-size="10">${dateFr(points[0].d)}</text>
    <text x="${W-6}" y="${H-4}" style="fill:var(--mut)" font-size="10" text-anchor="end">${dateFr(points[points.length-1].d)}</text>
  </svg>`;
}

function weekNum(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(),0,4); return 1 + Math.round(((d - w1)/DAY - 3 + ((w1.getDay()+6)%7))/7); }

function renderProgress(){
  const goal = S.config.weeklyGoal;
  let ws = weekStart(Date.now()); const weeks = [];
  for(let i=0;i<8;i++){ weeks.unshift({ws, n:weekCount(ws)}); ws = prevWeek(ws); }
  const maxN = Math.max(goal, ...weeks.map(w => w.n));
  const monthPR = S.sessions.filter(s => s.date > Date.now() - 30*DAY).reduce((a,s) => a + (s.prs||[]).length, 0);
  const real = S.sessions.filter(s => s.dayId !== "BASE").length;
  let h = `<div class="page-title"><h1>Progrès</h1><span class="mut">${IC.chart}</span></div>
    <div class="grid2" style="margin-bottom:16px">
      <div class="stat"><div class="ico blue">${G("dumbbell")}</div><div class="l">Séances au total</div><div class="v">${real}</div></div>
      <div class="stat"><div class="ico gold">${G("star")}</div><div class="l">Records (30 j)</div><div class="v">${monthPR}</div></div></div>
    <div class="sec-title">Calendrier</div>${calendar()}
    ${(() => { const mm = []; let m = monthOf(dayKey(Date.now())); for(let i=0;i<12;i++){ const a = monthAvg(m); if(a) mm.unshift({v:a.avg, d:keyTs(m + "-01")}); m = prevMonthKey(m); } return mm.length > 1 ? `<div class="sec-title">Poids (par mois)</div><div class="card">${lineChart(mm, "kg")}</div>` : ""; })()}
    <div class="sec-title">Séances par semaine</div>
    <div class="card"><div class="bars">${weeks.map((w,i) => `<div class="${w.n>=goal?"ok":w.n?"has":""}${i===weeks.length-1?" cur":""}" style="height:${Math.max(5, w.n/maxN*100)}%"><span>S${weekNum(w.ws)}</span></div>`).join("")}</div></div>`;

  const exs = allExercises();
  if(!S.progEx || !exs.some(e => e.id === S.progEx)){ const withH = exs.find(e => history(e.id).length); S.progEx = (withH || exs[0]).id; }
  const ex = exs.find(e => e.id === S.progEx);
  const hist = history(ex.id);
  const isSec = ex.unit === "sec";
  h += `<select data-in="progsel" style="margin-bottom:16px;font-weight:600;background:var(--card)">${exs.map(e => `<option value="${esc(e.id)}" ${e.id===ex.id?"selected":""}>${esc(e.name)}${history(e.id).length?"":" (pas encore fait)"}</option>`).join("")}</select>`;
  if(hist.length){
    const pts = hist.slice().reverse().map(e => ({v: entryBest(e), d: e.date}));
    const best = Math.max(...pts.map(p => p.v)), first = pts[0].v;
    const gain = first ? (best/first - 1) * 100 : 0;
    h += `<div class="card"><div class="best"><span class="tro">${G("trophy")}</span><div><div class="mut small">${isSec?"Meilleur temps":"Meilleur 1RM estimé"}</div>
        <div class="v">${fmt(Math.round(best*2)/2)} ${isSec?"s":"kg"}</div><div class="up">${G("up")}${gain>=0?"+":""}${fmt(Math.round(gain))} % depuis le début</div></div></div></div>
      ${stagnation(ex.id) ? `<div class="target hold" style="margin:-4px 0 16px">Stagnation sur les 3 dernières séances</div>` : ""}
      <div class="sec-title">Progression (${isSec?"temps":"1RM estimé"})</div>
      <div class="card">${lineChart(pts, isSec?"s":"kg")}</div>
      <div class="sec-title">Dernières séances</div>
      <div class="card">${hist.slice(0,8).map(e => `<div class="list-item"><span class="small">${dayFr(e.date)}</span><span class="small mut" style="text-align:right">${e.sets.map(s => (s.w?fmt(s.w)+"×":"") + s.r + (isSec?"s":"")).join(" / ")}</span></div>`).join("")}</div>`;
  } else h += `<div class="card mut small">Pas encore de données sur cet exercice.</div>`;
  return h;
}

function renderSettings(){
  const c = S.config;
  const ep = S.editProg;
  let h = `<div class="page-title"><h1>Réglages</h1><span class="mut">${IC.gear}</span></div>
    <div class="sec-title" style="margin-top:4px">Objectifs</div>
    <div class="card" style="padding:4px 16px">
      <div class="set-row"><span>Séances par semaine</span><div class="stepper"><button data-a="goalstep" data-v="-1">−</button><span class="v">${c.weeklyGoal}</span><button data-a="goalstep" data-v="1">+</button></div></div>
      <div class="set-row"><span>Son en fin de repos</span><button class="chip ${c.sound !== false ? "on" : ""}" data-a="sound">${c.sound !== false ? "Activé" : "Coupé"}</button></div>

      <button class="btn main" data-a="editprog" style="margin-bottom:6px">Modifier</button>`;
  } else {
    h += `<div class="card">`;
    ep.forEach((d, di) => {
      h += `<div style="margin-top:${di?18:0}px"><div class="daybar"><input data-in="pday" data-d="${di}" value="${esc(d.name)}">${ep.length > 1 ? `<button class="x" style="width:40px" data-a="delday" data-d="${di}">✕</button>` : ""}</div>`;
      d.ex.forEach((e, xi) => {
        h += `<div class="ed-ex"><input data-in="pex" data-d="${di}" data-x="${xi}" data-f="name" value="${esc(e.name)}">
          <div class="ed-row">
            <div><label>Séries</label><input inputmode="numeric" data-in="pex" data-d="${di}" data-x="${xi}" data-f="sets" value="${e.sets}"></div>
            <div><label>Min</label><input inputmode="numeric" data-in="pex" data-d="${di}" data-x="${xi}" data-f="min" value="${e.min}"></div>
            <div><label>Max</label><input inputmode="numeric" data-in="pex" data-d="${di}" data-x="${xi}" data-f="max" value="${e.max}"></div>
            <div><label>+kg</label><input inputmode="decimal" data-in="pex" data-d="${di}" data-x="${xi}" data-f="inc" value="${fmt(e.inc)}"></div>
            <button class="x" data-a="delex" data-d="${di}" data-x="${xi}">✕</button></div></div>`;
      });
      h += `<button class="addset" data-a="addex" data-d="${di}">${IC.plus} Ajouter un exercice</button></div>`;
    });
    h += `<button class="btn ghost sm" style="margin-top:14px" data-a="addday">${IC.plus} Ajouter une séance</button>
      <div class="mut small" style="margin:10px 0">Renommer un exercice garde son historique. « +kg » = la hausse de charge quand tu atteins le haut de la fourchette.</div>
      <div class="grid2"><button class="btn ghost sm" data-a="cancelprog">Annuler</button><button class="btn main sm" data-a="saveprog">Enregistrer</button></div></div>`;
  }

  h += `<div class="sec-title">Prochaine séance</div><div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${IC.bolt}<b>${esc(c.program[c.nextIdx] ? c.program[c.nextIdx].name : "")}</b></div><div class="chips">${c.program.map((d,i) =>
    `<button class="chip ${i===c.nextIdx?"on":""}" data-a="setnext" data-v="${i}">${esc(d.name)}</button>`).join("")}</div></div>`;

  h += `<div class="sec-title">Sauvegarde</div>
    <button class="btn ghost sm" data-a="claude" style="margin-bottom:10px">${IC.copy} Copier pour Claude</button>
    <button class="btn ghost sm" data-a="export" style="margin-bottom:10px">${IC.dl} Copier la sauvegarde</button>
    <div class="card" style="padding:12px">
      <div class="mini-h">${IC.file} Restaurer une sauvegarde</div>
      <textarea data-in="import" placeholder="Colle une sauvegarde ici">${esc(S.importText)}</textarea>
      <button class="btn ${S.confirm==="import"?"danger":"ghost"} sm" data-a="import" style="margin-top:10px">${S.confirm==="import" ? "Confirmer : remplacer mes données" : "Restaurer"}</button></div>
    <div class="mut small" style="margin:4px 2px 0">Tes données restent sur ce téléphone. « Copier pour Claude » : colle le texte dans une conversation pour que je t'analyse.</div>`;
  return h;
}

    const left = (S.timer.end - Date.now())/1000;
    h += `<div class="timer ${left<0?"over":""}" id="timerBox"><span class="lbl">Repos</span><span class="t" id="timerTxt">${left>=0?mmss(left):"+"+mmss(-left)}</span>
      <button class="p30" data-a="t30">+30 s</button><button class="x" data-a="tstop">${IC.x}</button></div>`;

        <div class="stat"><div class="ico gold">${G("trophy")}</div><div class="l">Records</div><div class="v">${s.prs.length}</div></div>
        <div class="stat"><div class="ico blue">${G("timer")}</div><div class="l">Durée</div><div class="v">${s.durationMin} min</div><div class="sub">${s.sets} série${s.sets>1?"s":""}</div></div>
        <div class="stat"><div class="ico blue">${G("bars")}</div><div class="l">Volume</div><div class="v">${dv===null ? fmt(Math.round(s.volume/100)/10)+" t" : (dv>=0?"+":"")+dv+" %"}</div><div class="sub">${dv===null ? "soulevé" : "vs la dernière fois"}</div></div></div>
      ${s.prs.length ? `<div class="card" style="margin-top:16px"><div class="mini-h">${G("trophy","gold")}Nouveaux records</div>${s.prs.map(p => `<div class="pr-row"><div style="flex:1;font-weight:600">${esc(p.name)}</div><div style="font-weight:700">${esc(p.txt)}</div></div>`).join("")}</div>` : ""}
      <button class="btn main" style="margin-top:20px" data-a="closemodal">Fermer</button></div></div>`;
  }
  if(S.modal && S.modal.type === "detail"){
    const s = S.sessions.find(x => x.id === S.modal.id);
    if(s){
      h += `<div class="ov" data-a="closemodal"><div class="sheet" data-stop="1"><div class="hero">${esc(s.dayName)}</div>
        <div class="mut small" style="margin-bottom:12px">${dayFr(s.date)} · ${s.durationMin||"?"} min · ${s.goalsTotal ? s.goalsHit+"/"+s.goalsTotal+" objectifs" : ""}</div>
        ${s.entries.map(e => `<div class="list-item"><span style="font-weight:600;font-size:14px">${esc(e.name)}${e.feel==="pain"?' <span class="badge red">douleur</span>':""}</span>
          <span class="small mut" style="text-align:right">${e.sets.map(x => (x.w?fmt(x.w)+"×":"") + x.r + (e.unit==="sec"?"s":"")).join(" / ")}</span></div>`).join("")}
        <button class="btn ${S.confirm==="del"?"danger":"ghost"} sm" style="margin-top:16px" data-a="delsession">${S.confirm==="del" ? "Confirmer la suppression" : "Supprimer cette séance"}</button>
        <button class="btn main sm" style="margin-top:8px" data-a="closemodal">Fermer</button></div></div>`;
    }
  }
  if(S.modal && S.modal.type === "exedit"){
    const f = S.modal.f, isNew = S.modal.ei < 0;
    h += `<div class="ov" data-a="closemodal"><div class="sheet" data-stop="1"><div class="hero">${isNew ? "Ajouter un exercice" : "Modifier l'exercice"}</div>
      <label class="fl">Nom</label><input data-in="me" data-f="name" value="${esc(f.name)}">
      <div class="grid2"><div><label class="fl">Séries</label><input inputmode="numeric" data-in="me" data-f="sets" value="${f.sets}"></div>
        <div><label class="fl">Hausse de charge (kg)</label><input inputmode="decimal" data-in="me" data-f="inc" value="${fmt(f.inc)}"></div>
        <div><label class="fl">Reps min</label><input inputmode="numeric" data-in="me" data-f="min" value="${f.min}"></div>
        <div><label class="fl">Reps max</label><input inputmode="numeric" data-in="me" data-f="max" value="${f.max}"></div></div>
      <label class="fl">Repos entre les séries (secondes)</label><input inputmode="numeric" data-in="me" data-f="rest" value="${f.rest||""}">
      <label class="fl">Note (facultatif)</label><input data-in="me" data-f="note" value="${esc(f.note||"")}">
      <label class="fl">Variantes (facultatif, séparées par des virgules)</label><input data-in="me" data-f="variants" placeholder="ex : Haltères, Machine" value="${esc(f.variants||"")}">
      <label class="chkrow"><input type="checkbox" data-in="me" data-f="ss" ${f.ss?"checked":""}> Superset : enchaîner avec l'exercice suivant</label>
      <div class="mut small" style="margin:10px 0">${isNew ? "Il sera ajouté à cette séance et au programme." : "Les changements s'appliquent au programme. Renommer garde ton historique."}</div>
      <button class="btn main sm" data-a="exsave">Enregistrer</button>
      ${isNew ? "" : `<button class="btn ghost sm" style="margin-top:8px" data-a="exskip">Retirer de cette séance seulement</button>
      <button class="btn danger sm" style="margin-top:8px" data-a="exdel">${S.confirm==="exdel" ? "Confirmer : supprimer du programme" : "Supprimer du programme"}</button>`}
      <button class="btn ghost sm" style="margin-top:8px" data-a="closemodal">Annuler</button></div></div>`;
  }
  if(S.modal && S.modal.type === "setup"){
    h += `<div class="ov" data-a="closemodal"><div class="sheet" data-stop="1"><div class="hero">Mon réglage</div>
      <div class="mut small" style="margin-bottom:10px">${esc(S.modal.name)} : hauteur du siège, dossier, prise, numéro de machine… Il s'affichera à chaque séance.</div>
      <input data-in="setupv" value="${esc(S.modal.v)}" placeholder="Ex : siège 4, dossier 2, prise neutre">
      <button class="btn main sm" style="margin-top:14px" data-a="setupsave">Enregistrer</button>
      <button class="btn ghost sm" style="margin-top:8px" data-a="closemodal">Annuler</button></div></div>`;
  }
  if(S.modal && S.modal.type === "swap"){
    const e = S.draft.entries[S.modal.ei], mus = musclesOf(e.baseName || e.name)[0];
    const seen = new Set([e.baseId]); const alts = [];
    S.config.program.forEach(dd => dd.ex.forEach(x => { if(!seen.has(x.id) && x.unit !== "routine" && musclesOf(x.name)[0] === mus){ seen.add(x.id); alts.push(x); } }));
    S.sessions.forEach(s => (s.entries||[]).forEach(x => { const id = x.exId.split("~")[0]; if(!seen.has(id) && x.unit === "reps" && musclesOf(x.name)[0] === mus){ seen.add(id); alts.push({id, name:x.name, sets:e.nSets, min:e.min, max:e.max, inc:e.inc, unit:"reps"}); } }));
    S.modal.alts = alts;
    h += `<div class="ov" data-a="closemodal"><div class="sheet" data-stop="1"><div class="hero">Remplacer pour aujourd'hui</div>
      <div class="mut small" style="margin-bottom:6px">${esc(e.baseName || e.name)} est pris ? Choisis un autre exercice pour le même muscle. Ton programme ne change pas.</div>
      ${alts.length ? `<div class="card" style="padding:4px 14px;margin:8px 0">${alts.map((x,i) => `<button class="prow" data-a="swapto" data-v="${i}"><div class="tile">${tileFig(x.name, 34)}</div><div class="grow"><div style="font-weight:600">${esc(x.name)}</div></div>${IC.chev}</button>`).join("")}</div>` : ""}
      <label class="fl">Ou un autre exercice</label><input data-in="swapname" value="${esc(S.modal.custom||"")}" placeholder="Ex : Développé couché machine">
      <button class="btn main sm" style="margin-top:12px" data-a="swapcustom">Utiliser cet exercice</button>
      <button class="btn ghost sm" style="margin-top:8px" data-a="closemodal">Annuler</button></div></div>`;
  }
  if(S.toast){ const k = S.toast.warn ? "warn" : (S.toast.kind || ""); const ic = {pr:"trophy", ok:null, link:"link", warn:"alert"}[k];
    h += `<div class="toast ${k}">${k === "ok" ? IC.check : ic ? G(ic) : ""}<span>${esc(S.toast.msg)}</span></div>`; }
  layer.innerHTML = h;
}

document.addEventListener("click", ev => {
  const stop = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-a]");
  if(!el) return;
  if(stop && !stop.contains(el) ) return;
  if(stop && el.classList.contains("ov")) return;
  const a = el.dataset.a, v = el.dataset.v;
  const ei = +el.dataset.e, si = +el.dataset.s;
  if(a !== "import" && a !== "delsession" && a !== "exdel") S.confirm = S.confirm === "abandon" && a !== "abandon" && a !== "closeconfirm" ? S.confirm : (a === "askabandon" ? "abandon" : null);
  switch(a){
    case "nav": S.view = v; S.editProg = null; window.scrollTo(0,0); break;
    case "start": startWorkout(+v); return;
    case "pick": S.pickIdx = +v; break;
    case "editnav": S.view = "settings"; S.editProg = clone(S.config.program); window.scrollTo(0,0); break;
    case "resume": S.view = "workout"; window.scrollTo(0,0); break;
    case "st": {
      const e = S.draft.entries[ei], s = e.sets[si], d = +el.dataset.d;
      if(el.dataset.f === "w"){ const step = e.inc >= 2.5 || e.inc === 0 ? 2.5 : e.inc >= 2 ? 2 : 1; s.w = Math.max(0, Math.round((s.w + d*step)*100)/100); }
      else s.r = Math.max(0, s.r + d * (e.unit === "sec" ? 5 : 1));
      saveDraft(); break;
    }
    case "chk": checkSet(ei, si); return;
    case "openex": if(S.openEx.has(ei)) S.openEx.delete(ei); else S.openEx.add(ei); break;
    case "warmup": {
      const e = S.draft.entries[ei], w0 = (workSets(e)[0] || {}).w || 0, st = stepOf(e), rd = x => Math.max(0, Math.round(x/st)*st);
      e.sets.unshift({w:rd(w0*.5), r:10, done:false, wu:true}, {w:rd(w0*.7), r:5, done:false, wu:true}); saveDraft(); break;
    }
    case "setup": { const e = S.draft.entries[ei]; S.modal = {type:"setup", ei, name:e.baseName || e.name, v:e.setup||""}; break; }
    case "setupsave": {
      const e = S.draft.entries[S.modal.ei], v = String(S.modal.v||"").trim();
      e.setup = v; S.config.program.forEach(dd => dd.ex.forEach(x => { if(x.id === e.baseId){ if(v) x.setup = v; else delete x.setup; } }));
      saveConfig(); saveDraft(); S.modal = null; showToast("Réglage enregistré", false, "ok"); break;
    }
    case "swap": S.modal = {type:"swap", ei, custom:""}; break;
    case "swapto": case "swapcustom": {
      const e = S.draft.entries[S.modal.ei]; let x;
      if(a === "swapto") x = S.modal.alts[+v];
      else { const n = String(S.modal.custom||"").trim(); if(!n){ showToast("Écris le nom de l'exercice", true); return; }
        x = {id:"x_" + n.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""), name:n, sets:e.nSets, min:e.min, max:e.max, inc:e.inc || 2.5, unit:"reps"}; }
      const ne = makeEntry(x, hasVar(x) ? lastVariant(x) : 0); ne.ss = e.ss; ne.swappedFrom = e.baseName || e.name;
      S.draft.entries[S.modal.ei] = ne; S.modal = null; saveDraft(); showToast("Remplacé pour aujourd'hui", false, "ok"); break;
    }
    case "wopen": S.wOpen = !S.wOpen; break;
    case "wstep": S.wDraft = Math.max(30, Math.round((S.wDraft + (+v))*10)/10); break;
    case "wsave": {
      const k = dayKey(Date.now()), w = Math.round(S.wDraft*10)/10;
      S.weights = S.weights.filter(x => x.d !== k).concat([{d:k, w}]).sort((p,q) => p.d < q.d ? -1 : 1);
      saveLocal(); S.wOpen = false; showToast("Poids enregistré : " + fmt(w) + " kg", false, "ok"); break;
    }
    case "cal": S.calOff = Math.min(0, S.calOff + (+v)); break;
    case "sound": S.config.sound = S.config.sound === false; saveConfig(); ensureAudio(); if(S.config.sound) beep(); break;
    case "deloadon": { const ws = weekStart(Date.now()); const nx = new Date(ws); nx.setDate(nx.getDate()+7); S.config.deloadUntil = nx.getTime(); S.config.lastDeload = Date.now(); saveConfig(); showToast("Décharge activée pour cette semaine", false, "ok"); break; }
    case "deloadoff": S.config.deloadUntil = 0; saveConfig(); break;
    case "addset": { const e = S.draft.entries[ei]; const l = e.sets[e.sets.length-1] || {w:0, r:e.min}; e.sets.push({w:l.w, r:l.r, done:false}); saveDraft(); break; }
    case "feel": { const e = S.draft.entries[ei]; e.feel = e.feel === v ? null : v; saveDraft(); if(v === "pain" && e.feel) showToast("Noté. Pas d'augmentation sur cet exercice la prochaine fois. Si ça persiste, vois un kiné.", true); break; }
    case "delset": {
      const e = S.draft.entries[ei]; if(e.sets.length < 2) break;
      let k = -1; for(let i=e.sets.length-1;i>=0;i--) if(!e.sets[i].done){ k = i; break; }
      e.sets.splice(k >= 0 ? k : e.sets.length-1, 1); saveDraft(); break;
    }
    case "exedit": { const e = S.draft.entries[ei];
      S.modal = {type:"exedit", ei, f:{name:e.baseName || e.name, sets:e.nSets, min:e.min, max:e.max, inc:e.inc, note:e.note||"", unit:e.unit, variants:(e.variants||[]).map(v => v.name).join(", "), ss:!!e.ss, rest:e.rest||0}}; break; }
    case "exadd": S.modal = {type:"exedit", ei:-1, f:{name:"", sets:3, min:8, max:12, inc:2.5, note:"", unit:"reps", variants:"", ss:false}}; break;
    case "exsave": {
      const f = S.modal.f, name = String(f.name).trim();
      if(!name){ showToast("Donne un nom à l'exercice", true); return; }
      if(f.min > f.max){ showToast("Reps min doit être ≤ reps max", true); return; }
      const sets = Math.max(1, Math.min(10, f.sets|0));
      const day = S.config.program[S.draft.dayIdx];
      if(S.modal.ei >= 0){
        const ei2 = S.modal.ei, e = S.draft.entries[ei2];
        let px = day && day.ex.find(x => x.id === (e.baseId || e.exId));
        if(!px){ px = {id:e.baseId || e.exId, unit:e.unit}; }
        const vars = parseVariants(f.variants, px.variants);
        Object.assign(px, {name, sets, min:f.min, max:f.max, inc:f.inc, note:f.note, ss:!!f.ss}); if(f.rest) px.rest = f.rest; else delete px.rest;
        if(vars) px.variants = vars; else delete px.variants;
        if(!e.sets.some(s => s.done)) S.draft.entries[ei2] = makeEntry(px, vars ? Math.min(e.vi||0, vars.length-1) : 0);
        else Object.assign(e, {baseName:name, name:exLabel(px, e.vi||0), nSets:sets, min:f.min, max:f.max, inc:f.inc, note:f.note, ss:!!f.ss, rest:restFor(px)});
      } else {
        const ex = {id:"ex_" + uid(), name, sets, min:f.min, max:f.max, inc:f.inc, unit:"reps", note:f.note, ss:!!f.ss};
        const vars = parseVariants(f.variants, null); if(vars) ex.variants = vars;
        if(day) day.ex.push(ex);
        S.draft.entries.push(makeEntry(ex, 0));
      }
      saveConfig(); saveDraft(); S.modal = null; showToast("Enregistré", false, "ok"); break;
    }
    case "variant": {
      const e = S.draft.entries[ei], i = +v; if(i === e.vi) break;
      if(e.sets.some(s => s.done)){ showToast("Décoche tes séries avant de changer de variante", true); return; }
      const day = S.config.program[S.draft.dayIdx], px = day && day.ex.find(x => x.id === e.baseId);
      if(!px) break;
      S.draft.entries[ei] = makeEntry(px, i); saveDraft(); break;
    }
    case "exskip": S.draft.entries.splice(S.modal.ei, 1); saveDraft(); S.modal = null; break;
    case "exdel": {
      if(S.confirm !== "exdel"){ S.confirm = "exdel"; break; }
      const e = S.draft.entries[S.modal.ei], day = S.config.program[S.draft.dayIdx];
      if(day) day.ex = day.ex.filter(x => x.id !== (e.baseId || e.exId));
      S.draft.entries.splice(S.modal.ei, 1);
      saveConfig(); saveDraft(); S.modal = null; S.confirm = null; showToast("Supprimé du programme"); break;
    }
    case "finish": finishWorkout(); return;
    case "askabandon": S.confirm = "abandon"; break;
    case "abandon": S.draft = null; S.confirm = null; saveDraft(); stopTimer(); S.openEx = new Set(); S.view = "home"; break;
    case "closeconfirm": S.confirm = null; break;
    case "t30": if(S.timer){ S.timer.end += 30000; S.timer.buzzed = false; } break;
    case "tstop": stopTimer(); break;
    case "closemodal": S.modal = null; S.confirm = null; break;
    case "detail": S.modal = {type:"detail", id:v}; break;
    case "delsession":
      if(S.confirm === "del"){ const id = S.modal.id; S.sessions = S.sessions.filter(s => s.id !== id); writeDoc("sessions/" + id, null); saveLocal(); S.modal = null; S.confirm = null; showToast("Séance supprimée"); }
      else S.confirm = "del";
      break;
    case "prog": S.view = "progress"; S.progEx = v; window.scrollTo(0,0); break;
    case "editprog": S.editProg = clone(S.config.program); break;
    case "cancelprog": S.editProg = null; break;
    case "addex": S.editProg[+el.dataset.d].ex.push({id:"ex_"+uid(), name:"Nouvel exercice", sets:3, min:8, max:12, inc:2.5, unit:"reps"}); break;
    case "delex": S.editProg[+el.dataset.d].ex.splice(+el.dataset.x, 1); break;
    case "delday": S.editProg.splice(+el.dataset.d, 1); break;
    case "addday": S.editProg.push({id:"day_"+uid(), name:"Nouvelle séance", ex:[]}); break;
    case "saveprog": S.config.program = S.editProg; S.editProg = null; S.config.nextIdx %= S.config.program.length; saveConfig(); showToast("Programme enregistré"); break;
    case "goalstep": S.config.weeklyGoal = Math.max(1, Math.min(7, S.config.weeklyGoal + (+v))); saveConfig(); break;
    case "reststep": S.config.restSec = Math.max(30, Math.min(300, S.config.restSec + (+v))); saveConfig(); break;
    case "setnext": S.config.nextIdx = +v; saveConfig(); break;
    case "claude": {
      const txt = claudeSummary();
      navigator.clipboard.writeText(txt).then(() => showToast("Copié, colle-le dans Claude", false, "ok"), () => { S.importText = txt; render(); showToast("Copie bloquée : sélectionne le texte ci-dessous", true); });
      return;
    }
    case "export": {
      const txt = JSON.stringify({app:"gymtracker", v:1, config:S.config, sessions:S.sessions, weights:S.weights});
      navigator.clipboard.writeText(txt).then(() => showToast("Sauvegarde copiée", false, "ok"), () => { S.importText = txt; render(); showToast("Copie bloquée : sélectionne le texte ci-dessous", true); });
      return;
    }
    case "import": {
      let data; try{ data = JSON.parse(S.importText); }catch(e){ showToast("Sauvegarde illisible", true); S.confirm = null; break; }
      if(!data || data.app !== "gymtracker" || !Array.isArray(data.sessions)){ showToast("Ce n'est pas une sauvegarde Gym Tracker", true); S.confirm = null; break; }
      if(S.confirm !== "import"){ S.confirm = "import"; break; }
      S.confirm = null;
      const ids = new Set(data.sessions.map(s => s.id));
      S.sessions.filter(s => !ids.has(s.id)).forEach(s => writeDoc("sessions/" + s.id, null));
      data.sessions.forEach(s => writeDoc("sessions/" + s.id, s));
      S.sessions = data.sessions.slice().sort((a,b) => b.date - a.date);
      S.config = normConfig(data.config); if(Array.isArray(data.weights)) S.weights = data.weights; saveConfig(); S.importText = "";
      showToast("Sauvegarde restaurée", false, "ok"); break;
    }
  }
  render();
});
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset.in; if(!k) return;
  const num = x => parseFloat(String(x).replace(",", "."));
  if(k === "w" || k === "r"){
    const s = S.draft.entries[+el.dataset.e].sets[+el.dataset.s];
    const n = num(el.value); if(!isNaN(n)){ s[k] = Math.max(0, k === "r" ? Math.round(n) : n); saveLocal(); }
  } else if(k === "me"){
    const f = el.dataset.f;
    if(f === "ss") S.modal.f.ss = el.checked;
    else if(f === "name" || f === "note" || f === "variants") S.modal.f[f] = el.value;
    else { const n = num(el.value); if(!isNaN(n)) S.modal.f[f] = f === "inc" ? Math.max(0, n) : Math.max(0, Math.round(n)); }
  } else if(k === "setupv") S.modal.v = el.value;
  else if(k === "swapname") S.modal.custom = el.value;
  else if(k === "import") S.importText = el.value;
  else if(k === "pday") S.editProg[+el.dataset.d].name = el.value;
  else if(k === "pex"){
    const e = S.editProg[+el.dataset.d].ex[+el.dataset.x], f = el.dataset.f;
    if(f === "name") e.name = el.value; else { const n = num(el.value); if(!isNaN(n)) e[f] = f === "inc" ? n : Math.max(1, Math.round(n)); }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target, k = el.dataset.in; if(!k) return;
  const n = parseInt(el.value, 10);
  if(k === "w" || k === "r") saveDraft();
  if(k === "goal" && n > 0 && n < 15){ S.config.weeklyGoal = n; saveConfig(); render(); }
  if(k === "rest" && n >= 15){ S.config.restSec = n; saveConfig(); }
  if(k === "progsel"){ S.progEx = el.value; render(); }
});

/* ================= DÉMARRAGE ================= */
loadLocal();
if(S.draft) S.view = "workout";
S.sync = "device";
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
